<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dfe6ec">
<title>mytbe</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="mytbe">
<script>
/* Antes de pintar nada, para que no pegue un flash blanco al abrir de noche. */
(function(){
  try{
    var t = localStorage.getItem('mytbe.tema');
    if(t) document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>
<style>
/* ===========================================================
   Estetica YouTube 2005: Arial chica, cajas plateadas con
   biselado, links azules subrayados, barra celeste de formulario.

   Los colores son variables porque hay dos paletas. El modo oscuro
   no invierte: reinterpreta el plateado y el celeste en tonos frios
   oscuros, y aclara el rojo y el azul de los links, que a #cc181e y
   #0000cc quedarian ilegibles sobre fondo negro.
   =========================================================== */
:root{
  --page:#dfe6ec; --panel:#fff;
  --ink:#000; --ink-2:#525c66; --ink-3:#6f6f6f; --ink-4:#555;
  --line:#e2e2e2; --edge:#9a9a9a;
  --link:#0000cc; --link-v:#551a8b;
  --red:#cc181e; --red-text:#cc181e; --green:#2e7d32;
  --bar:#c6d9ef; --bar-line:#a8bed2;
  --field:#fff; --field-edge:#7f9db9; --field-focus:#4a76a8;
  --btn-a:#fdfdfd; --btn-b:#dcdcdc; --btn-edge:#8c8c8c; --btn-ink:#1b1b1b;
  --btn-a2:#d0d0d0; --btn-b2:#e8e8e8;
  --tab-a:#fcfcfc; --tab-b:#cfcfcf; --tab-ink:#4d4d4d;
  --thumb:#ececec; --thumb-edge:#999;
  --row-hit:#eaf1fa; --x-ink:#767676; --x-hit:#f0f0f0;
  --title-a:#5b87b8; --title-b:#3d6a9c; --box-edge:#7a7a7a;
  --sel-bg:#fff8f8; --logo-ink:#1b1b1b; --foot-ink:#6b7a86;
  --shadow:rgba(0,0,0,.35); --veil:rgba(0,0,0,.45);
}
/* Sistema en oscuro, salvo que el usuario haya elegido claro a mano */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#171b21; --panel:#10141a;
    --ink:#dfe4ea; --ink-2:#97a2ad; --ink-3:#7d8894; --ink-4:#8b96a1;
    --line:#262d36; --edge:#39424d;
    --link:#7fb2ff; --link-v:#c4a7e7;
    --red:#cc181e; --red-text:#ff5f5f; --green:#6fbf73;
    --bar:#1e2c3d; --bar-line:#3a4d64;
    --field:#0b0e12; --field-edge:#46596e; --field-focus:#6f9fd0;
    --btn-a:#39414b; --btn-b:#272d35; --btn-edge:#4a545f; --btn-ink:#d3d9df;
    --btn-a2:#222831; --btn-b2:#333a44;
    --tab-a:#333b45; --tab-b:#232931; --tab-ink:#a9b3bd;
    --thumb:#232931; --thumb-edge:#3d4650;
    --row-hit:#1c2734; --x-ink:#7d8894; --x-hit:#232931;
    --title-a:#2f4b6b; --title-b:#22374f; --box-edge:#3d4650;
    --sel-bg:#2a1a1c; --logo-ink:#e8ecef; --foot-ink:#6d7883;
    --shadow:rgba(0,0,0,.6); --veil:rgba(0,0,0,.65);
  }
}
/* Eleccion explicita del usuario, gana en los dos sentidos */
:root[data-theme="dark"]{
  --page:#171b21; --panel:#10141a;
  --ink:#dfe4ea; --ink-2:#97a2ad; --ink-3:#7d8894; --ink-4:#8b96a1;
  --line:#262d36; --edge:#39424d;
  --link:#7fb2ff; --link-v:#c4a7e7;
  --red:#cc181e; --red-text:#ff5f5f; --green:#6fbf73;
  --bar:#1e2c3d; --bar-line:#3a4d64;
  --field:#0b0e12; --field-edge:#46596e; --field-focus:#6f9fd0;
  --btn-a:#39414b; --btn-b:#272d35; --btn-edge:#4a545f; --btn-ink:#d3d9df;
  --btn-a2:#222831; --btn-b2:#333a44;
  --tab-a:#333b45; --tab-b:#232931; --tab-ink:#a9b3bd;
  --thumb:#232931; --thumb-edge:#3d4650;
  --row-hit:#1c2734; --x-ink:#7d8894; --x-hit:#232931;
  --title-a:#2f4b6b; --title-b:#22374f; --box-edge:#3d4650;
  --sel-bg:#2a1a1c; --logo-ink:#e8ecef; --foot-ink:#6d7883;
  --shadow:rgba(0,0,0,.6); --veil:rgba(0,0,0,.65);
}

/* Dos colores que faltaban: el azul que reemplaza al rojo en el segmentado
   (el rojo queda solo para EN VIVO y el logo) y el rojo de los botones que
   destruyen algo. Se definen aparte para no repetir las tres paletas. */
:root{--sel:#3d6a9c; --peligro-a:#d95459; --peligro-b:#b81f26; --peligro-edge:#8f181e;
       --grupo-a:#eef2f6; --grupo-b:#dde5ed}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--sel:#3f6da4; --peligro-a:#7d2a2e; --peligro-b:#5d1e21;
    --peligro-edge:#8c3a3e; --grupo-a:#232b35; --grupo-b:#1a212a}
}
:root[data-theme="dark"]{--sel:#3f6da4; --peligro-a:#7d2a2e; --peligro-b:#5d1e21;
  --peligro-edge:#8c3a3e; --grupo-a:#232b35; --grupo-b:#1a212a}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--page);
  font:13px/1.4 Arial,Helvetica,sans-serif;
  color:var(--ink);
  padding:8px 8px 24px;
}
a{color:var(--link);text-decoration:underline;cursor:pointer}
a:visited{color:var(--link-v)}

.shell{max-width:680px;margin:0 auto}

/* ---- encabezado ---- */
.top{display:flex;align-items:flex-end;gap:10px;padding:2px 4px 6px}
.logo{font:italic 900 27px/0.9 Arial,Helvetica,sans-serif;letter-spacing:-1px;white-space:nowrap}
.logo .a{color:var(--logo-ink)}
.logo .b{
  color:#fff;background:var(--red);border-radius:7px;
  padding:2px 6px 3px;margin-left:2px;display:inline-block
}
.topright{margin-left:auto;text-align:right;font-size:11px;color:var(--ink-4);line-height:1.4}
/* Iconos en vez de palabras: ocupan menos, se tocan mejor y no compiten con
   los links azules del contenido. El nombre vive en el tooltip. */
.ico{display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;font-size:17px;text-decoration:none;position:relative;
  border-radius:4px;margin:0}
.ico:active{background:var(--x-hit)}
/* Punto rojo cuando la sincronizacion se queja: es lo unico del menu que
   necesita avisar sin que lo abran. */
.ico.alerta::after{content:"";position:absolute;top:4px;right:4px;width:7px;height:7px;
  border-radius:50%;background:var(--red-text)}

/* ---- pestanas ---- */
.tabswrap{position:relative}
/* Sin esto, con cinco carpetas la sexta no existe: la barra esta oculta y
   nada avisa que hay mas al costado. Cada degradado aparece solo del lado
   donde efectivamente quedo contenido cortado. */
.tabswrap::before,.tabswrap::after{
  content:"";position:absolute;top:0;bottom:0;width:24px;z-index:3;
  pointer-events:none;opacity:0;transition:opacity .15s}
.tabswrap::before{left:0;background:linear-gradient(90deg,var(--page),transparent)}
.tabswrap::after{right:0;background:linear-gradient(270deg,var(--page),transparent)}
.tabswrap.hay-izq::before,.tabswrap.hay-der::after{opacity:1}
@media (prefers-reduced-motion:reduce){.tabswrap::before,.tabswrap::after{transition:none}}
.tabs{display:flex;gap:2px;overflow-x:auto;white-space:nowrap;
  padding:0 2px;scrollbar-width:none;scroll-behavior:smooth}
.tabs .tab{scroll-snap-align:end}
.tabs::-webkit-scrollbar{display:none}
.tab{
  font:bold 11px/1 Arial,Helvetica,sans-serif;letter-spacing:.08em;
  color:var(--tab-ink);background:linear-gradient(var(--tab-a),var(--tab-b));
  border:1px solid var(--edge);border-bottom:none;border-radius:6px 6px 0 0;
  padding:15px 14px 14px;cursor:pointer;flex:none;text-transform:uppercase
}
.tab.on{background:var(--panel);color:var(--ink);padding-bottom:15px;position:relative;z-index:2}
.tab.nueva{font-size:15px;letter-spacing:0;padding:13px 14px 12px;color:var(--ink-2)}

/* ---- barra celeste ---- */
.bluebar{
  background:var(--bar);border:1px solid var(--edge);border-radius:0 6px 0 0;
  padding:10px 12px;margin-top:-1px;position:relative;z-index:1
}
.row1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row1 label{font-weight:bold;font-size:12px}
input[type=text]{
  flex:1;min-width:120px;background:var(--field);border:1px solid var(--field-edge);
  padding:6px 5px;font:16px Arial,Helvetica,sans-serif;color:var(--ink);border-radius:0
}
input[type=text]:focus{outline:1px solid var(--field-focus)}
button{
  font:bold 12px Arial,Helvetica,sans-serif;color:var(--btn-ink);
  background:linear-gradient(var(--btn-a),var(--btn-b));border:1px solid var(--btn-edge);
  border-radius:3px;padding:11px 14px;cursor:pointer
}
button:active{background:linear-gradient(var(--btn-a2),var(--btn-b2))}
/* Un boton que se queda apretado, en lugar de los dos desplegables: era el
   unico filtro que se usaba y elegir en un <select> chico con el pulgar es
   una pelea. El hueco invisible copia la etiqueta "Buscar:" para que arranque
   en la misma columna que el campo, justo debajo. */
.row2{display:flex;align-items:center;gap:6px;margin-top:6px}
.hueco{font:bold 12px Arial,Helvetica,sans-serif;visibility:hidden;flex:none}
.vivo{padding:9px 13px;font:bold 12px Arial,Helvetica,sans-serif}
/* Prendido va en rojo, que en esta app significa una sola cosa: esta al aire. */
.vivo[aria-pressed="true"]{
  background:var(--red);border-color:var(--red);color:#fff}
/* El de playlist se prende azul: el rojo ya significa "esta al aire". */
#f-lista[aria-pressed="true"]{background:var(--sel);border-color:var(--sel);color:#fff}

/* La barra del modo playlist: lo que llevas elegido y que hacer con eso. */
.barralista{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:var(--bar);border:1px solid var(--edge);border-top:none;
  padding:8px 10px;font-size:12px;color:var(--ink-4)}
.barralista[hidden]{display:none}
.barralista b{color:var(--ink)}
.barralista button{padding:8px 12px;font-size:12px}
.barralista .der{margin-left:auto;display:flex;gap:6px}

/* ---- panel ---- */
.panel{
  background:var(--panel);border:1px solid var(--edge);border-top:none;
  border-radius:0 0 12px 12px;padding:14px 12px;min-height:220px
}
.crumb{font-size:11px;color:var(--ink-4);margin:-4px 0 12px}

/* ---- filas de contenido ----
   La fila entera dispara. El texto conserva el aspecto de link chico de 2005,
   pero el area tactil es toda la fila: se usa a oscuras y con una mano. */
.row{display:flex;gap:10px;padding:12px 4px;margin:0 -4px;
  border-bottom:1px solid var(--line);align-items:flex-start;cursor:pointer}
.row:last-of-type{border-bottom:none}
.row:active{background:var(--row-hit)}
.th{width:96px;height:72px;flex:none;border:1px solid var(--thumb-edge);
  background:var(--thumb);object-fit:cover}
.info{flex:1;min-width:0}
/* El titulo era azul de link a 13px y competia con las acciones, que tambien
   son azules. Ahora es tinta plena a 15px: el azul quedo para lo que se toca
   aparte, y el subrayado solo aparece al presionar la fila. */
.ttl{font-size:15px;font-weight:bold;line-height:1.25;margin:0 0 4px;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row:active .ttl{text-decoration:underline}
.chan{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:11px;color:var(--ink-2);line-height:1.6}
.sub b{color:var(--ink-3)}
.sub b.dura{color:var(--ink-2);font-variant-numeric:tabular-nums}
.live{color:var(--red-text);font-weight:bold}
.eslista{color:var(--sel);font-weight:bold}

/* Antes "guardar" era un link de 11px DENTRO de la fila que dispara: el
   toque impreciso abria YouTube cuando querias guardar. Ahora tiene columna
   propia de 44x44 a la derecha, igual que la X de la lista guardada. */
.add{width:44px;height:44px;flex:none;align-self:center;padding:0;
  font:bold 20px/1 Arial,Helvetica,sans-serif;color:var(--btn-ink);
  background:linear-gradient(var(--btn-a),var(--btn-b));
  border:1px solid var(--btn-edge);border-radius:3px}
.add:active{background:linear-gradient(var(--btn-a2),var(--btn-b2))}
.add.on{background:none;border-color:var(--green);color:var(--green);font-size:17px}
.saved{color:var(--green)}

/* ---- lista guardada: compacta, para ver muchas de un vistazo ----
   Sigue midiendo mas de 50px de alto, que es lo minimo para tocar sin mirar. */
/* La fila compacta: la miniatura en la proporcion en que YouTube la entrega
   (16:9) en vez de estirada a 54x40, con el tiempo apoyado encima como en
   cualquier reproductor. Sale mas ancha, mas baja y con mas imagen: la fila
   pasa de 52 a 48 de alto. */
.row.compact{padding:6px;margin:0 -6px;gap:10px;align-items:center;
  border-bottom:none;border-radius:8px}
.row.compact + .row.compact{margin-top:1px}
.tapa{position:relative;flex:none;line-height:0}
.row.compact .th{width:64px;height:36px;border-radius:5px;border:1px solid var(--thumb-edge)}
.row.compact .ttl{-webkit-line-clamp:1;margin:0 0 2px}
.row.compact .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-size:11px;line-height:1.45}

/* Lo que antes era texto en la linea de abajo. Arriba de la imagen no ocupa
   lugar, y deja el renglon libre para el canal. */
.chip{position:absolute;right:3px;bottom:3px;padding:1px 4px;border-radius:3px;
  background:rgba(0,0,0,.8);color:#fff;font:bold 9.5px/1.4 Arial,Helvetica,sans-serif;
  font-variant-numeric:tabular-nums;letter-spacing:.02em}
.chip.envivo{background:var(--red)}
.chip.eslista{background:var(--sel)}
.th.icono{display:flex;align-items:center;justify-content:center;font-size:21px;
  background:var(--thumb);border-color:var(--thumb-edge);border-radius:5px}
/* ---- columna de carpetas ----
   La solapa se parte en dos: a la izquierda que hay, a la derecha lo que
   elegiste. La columna scrollea sola, asi que crecer a cincuenta carpetas no
   corre ni un pixel de la lista.

   Abajo de 620px no entra: se esconde y se abre por encima del panel con el
   boton que dice donde estas parado. */
.panel{position:relative}
.dos{display:flex;align-items:stretch;margin:-14px -12px;min-height:260px}
.lado{width:172px;flex:none;border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:8px 0}
.lado .filtrac{display:flex;gap:5px;padding:0 8px 8px}
.lado .filtrac input{width:100%;font-size:16px;padding:5px 7px}
.cps{overflow-y:auto;max-height:70vh;padding:0 6px}
.cp{display:flex;align-items:center;gap:6px;width:100%;height:30px;padding:0 8px;
  border:none;background:none;border-radius:6px;text-align:left;
  font:12.5px Arial,Helvetica,sans-serif;color:var(--ink);white-space:nowrap;overflow:hidden}
.cp.hija{padding-left:20px;font-size:12px;color:var(--ink-2)}
.cp.on{background:var(--row-hit);color:var(--ink);font-weight:bold}
.cp .nm{overflow:hidden;text-overflow:ellipsis}
.cp .cn{margin-left:auto;font-size:10px;color:var(--ink-3);font-weight:normal;flex:none}
.cp:active{background:var(--x-hit)}
.rayita{height:1px;background:var(--line);margin:6px 8px}

.ladopie{padding:8px;border-top:1px solid var(--line);display:flex;gap:5px}
.ladopie button{flex:1;padding:7px 8px;font-size:11px}

/* ---- acomodar ----
   Ocupa el panel entero. Meter tres botones por fila en una columna de 172px
   dejaba los nombres cortados en "Momo s..."; aca la fila es solo el nombre y
   los botones son unos solos, abajo, que actuan sobre el que elegiste. */
.acom{display:flex;flex-direction:column;min-height:300px}
.acomtit{font-size:11.5px;color:var(--ink-2);margin:0 0 10px}
.acomlista{flex:1}
.ac{display:flex;align-items:center;gap:8px;width:100%;padding:11px 12px;margin-bottom:2px;
  border:1px solid transparent;border-radius:8px;background:none;text-align:left;
  font:13.5px Arial,Helvetica,sans-serif;color:var(--ink)}
.ac .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac .cn{color:var(--ink-3);font-size:11px;flex:none}
.ac.hija{margin-left:22px}
.ac.hija2{margin-left:44px}
.ac.sel{background:var(--row-hit);border-color:var(--sel)}
.ac.encima{background:var(--sel);color:#fff}
.ac:active{background:var(--x-hit)}
.acombarra{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:6px;padding:10px 0 2px;margin-top:10px}
.acombarra button{min-width:88px}
.acombarra button{flex:1;padding:11px 8px}
.acombarra button:disabled{opacity:.35}
.acombarra .listo{flex:0 0 auto;padding:11px 16px}
.tabla{flex:1;min-width:0;padding:14px 12px}

/* el boton que reemplaza la columna en pantalla angosta */
.btnlado{display:none;align-items:center;gap:7px;width:100%;margin-bottom:10px;
  padding:8px 10px;text-align:left;font:bold 12px Arial,Helvetica,sans-serif}
.btnlado .cn{margin-left:auto;font-weight:normal;color:var(--ink-3);font-size:10.5px}

@media (max-width:620px){
  .dos{display:block;margin:-14px -12px}
  .lado{display:none}
  .lado.abierto{display:flex;position:absolute;inset:0;z-index:6;width:auto;
    background:var(--panel);border-right:none;border-radius:0 0 12px 12px}
  .lado.abierto .cps{max-height:none;flex:1}
  .btnlado{display:flex}
  .tabla{padding:14px 12px}
}

/* ---- vista lista ----
   La subcarpeta deja de ser un lugar al que se entra y pasa a ser un
   encabezado. La cabecera se queda pegada arriba mientras se scrollea, que
   es lo unico que hace legible una lista larga de grupos. */
/* Plano y sin degradado: el biselado plateado es de las cajas y los botones,
   y aca lo unico que hace es pesar. Fondo del panel para que siga sirviendo
   de encabezado pegajoso. */
.grupo{display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:4;
  margin:16px -12px 4px;padding:7px 12px 6px;cursor:pointer;
  background:var(--panel);border-bottom:1px solid var(--edge);
  font:bold 11px Arial,Helvetica,sans-serif;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink)}
.grupo:first-child{margin-top:0}
.grupo .flecha{font-size:9px;color:var(--ink-3);flex:none}
.grupo .ruta{color:var(--ink-3);font-weight:normal}
.grupo .n{margin-left:auto;font-weight:normal;letter-spacing:0;color:var(--ink-3);flex:none;
  text-transform:none;font-size:10.5px}
.grupo .masg{margin-left:8px;flex:none;width:26px;height:24px;padding:0;border-radius:4px;
  font:bold 14px Arial,Helvetica,sans-serif;color:var(--ink-2);
  background:none;border:1px solid var(--edge)}
.grupo .masg:active{background:var(--x-hit)}
.grupo .masg.ancho{width:auto;padding:0 8px;font-size:11px;letter-spacing:.04em}
.grupo.plegado{color:var(--ink-3)}

/* Mas densa que la vista de carpetas: en una lista larga, la densidad es lo
   que hace rapido encontrar algo. */
.row.lista .ttl{font-size:14px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;display:block}

.filtro{display:flex;margin-bottom:10px}
.filtro input{width:100%;font-size:16px}
.row.compact .ttl{-webkit-line-clamp:1;margin:0 0 1px}
.row.compact .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-size:10.5px;line-height:1.5}
.x{background:none;border:none;color:var(--x-ink);font-size:19px;line-height:1;
  padding:9px 7px;flex:none;border-radius:3px}
.x:active{background:var(--x-hit);color:var(--red-text)}

/* Modo ordenar: mientras esta prendido la fila no dispara, asi que mover una
   radio no puede terminar en YouTube por accidente. */
.ord{display:flex;flex-direction:column;gap:3px;flex:none}
.ord button{width:40px;height:25px;padding:0;font-size:9px;border-radius:3px}
.ord button:disabled{opacity:.35}
.row.ordenando{cursor:default;background:var(--row-hit)}

/* Eligiendo: el numero dice en que orden va a sonar, no solo que esta puesto. */
.row.marcado{background:var(--row-hit)}
.row.apagada{opacity:.45}
.add.vacio{border:none;background:none}
.row.eligiendo .add{font-size:15px}

<body>

   --><a id="menulink" class="ico" title="Configuracion">&#9881;&#65039;</a>

<script>
/* ============ almacenamiento ============ */
var LS = 'mytbe.v1';
/* La app se llamaba "disparador" durante el desarrollo: si quedo algo
   guardado con las claves viejas, lo pasamos una sola vez y las borramos. */
(function migrar(){
  if(localStorage.getItem(LS)) return;
  var viejo = localStorage.getItem('disparador.v1');
  if(viejo){ localStorage.setItem(LS, viejo); localStorage.removeItem('disparador.v1'); }
  var k = localStorage.getItem('disparador.key');
  if(k && !localStorage.getItem('mytbe.key')){
    localStorage.setItem('mytbe.key', k); localStorage.removeItem('disparador.key');
  }
})();
function defaults(){
  return {
    folders: [
      {id:'radios',       name:'Radios',       items:[]},
      {id:'documentales', name:'Documentales', items:[]},
      {id:'verdespues',   name:'Ver despues',  items:[]}
    ],
    quota: {date:'', count:0},
    reproducidos: [],
    /* Para sincronizar hace falta saber que se borro, no solo que quedo: sin
       esto, borrar en el celular revive al sincronizar con la tablet. */
    borrados: {},
    vaciadoEn: 0
  };
}
/* Los datos ya no se leen al arrancar: llegan cuando se abre un perfil, que
   puede estar cifrado. Hasta entonces db es un molde vacio. */
var db = defaults(), current = '';

function normalizar(d){
  if(!d || !d.folders || !d.folders.length) d = defaults();
  if(!d.quota)        d.quota = {date:'', count:0};
  if(!d.reproducidos) d.reproducidos = [];
  if(!d.borrados)     d.borrados = {};
  if(!d.vaciadoEn)    d.vaciadoEn = 0;
  if(!d.gist)         d.gist = {};

  /* Lo guardado antes de este arreglo tiene las entidades adentro. */
  d.folders.forEach(function(f){
    (f.items || []).forEach(function(it){
      it.title = limpiarTexto(it.title);
      it.channel = limpiarTexto(it.channel);
    });
  });
  d.reproducidos.forEach(function(r){
    r.title = limpiarTexto(r.title);
    r.channel = limpiarTexto(r.channel);
  });
  /* Una marca de borrado vieja ya no le gana a nada: se puede tirar. */
  var limite = Date.now() - 60 * 24 * 60 * 60 * 1000;
  for(var k in d.borrados) if(d.borrados[k] < limite) delete d.borrados[k];
  return d;
}

function save(){
  guardarDatos();
  /* Mientras aplicamos lo que vino de afuera no hay nada nuevo que subir. */
  if(!aplicandoRemoto) programarSync();
}

/* La clave de la API es del aparato, no de la persona: los dos perfiles
   buscan con la misma y comparten la cuota. */
function getKey(){ return localStorage.getItem('mytbe.key') || ''; }
function setKey(k){ localStorage.setItem('mytbe.key', k.trim()); }
function claveValida(k){ return k.indexOf('AIza') === 0 && k.length >= 20; }

/* La clave puede viajar en el enlace: .../mytbe/#k=AIza...
   Asi se pone en un telefono nuevo sin volver a tipearla. La sacamos de la
   barra apenas la guardamos, para que no quede a la vista ni en el historial. */
function claveDelEnlace(){
  var m = /[#&]k=([^&]*)/.exec(location.hash || '');
  if(!m && !/[#&]g=/.test(location.hash || '')) return;
  if(!m) m = ['', ''];
  var k;
  try { k = decodeURIComponent(m[1]).trim(); } catch(e){ k = ''; }
  if(claveValida(k)) setKey(k);

  var mg = /[#&]g=([^&]*)/.exec(location.hash || '');
  if(mg){
    var partes = decodeURIComponent(mg[1]).split(':');
    /* Todavia no hay perfil abierto donde guardarlo: espera en la puerta. */
    if(partes.length === 2 && partes[0] && partes[1])
      gistPendiente = {token:partes[0], id:partes[1], ultima:0};
  }

  if(history.replaceState) history.replaceState(null, '', location.pathname + location.search);
  else location.hash = '';
}
claveDelEnlace();
/* Si la app ya estaba abierta y pegan el enlace, cambia el hash sin recargar. */
window.addEventListener('hashchange', claveDelEnlace);

/* Sin esto, iOS y Android pueden barrer el localStorage de un sitio que no se
   abre hace unos dias, y la clave se pierde sola aunque este bien guardada. */
if(navigator.storage && navigator.storage.persist){
  try { navigator.storage.persist(); } catch(e){}
}

/* ============ utilidades ============ */
function $(s){ return document.querySelector(s); }
/* La API devuelve los titulos ya escapados como HTML: "Live &quot;Slane&quot;".
   Al escaparlos otra vez para pintarlos, el &quot; quedaba a la vista. Hay que
   desarmarlos primero, y recien despues escapar para mostrar. */
function limpiarTexto(t){
  return String(t == null ? '' : t)
    .replace(/&quot;/g, '"')
    .replace(/&#0?39;/g, "'")
    .replace(/&apos;/g, "'")
    .replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>')
    .replace(/&nbsp;/g, ' ')
    .replace(/&#(\d+);/g, function(_, n){ return String.fromCharCode(+n); })
    .replace(/&amp;/g, '&');   /* ultimo, o revive las entidades ya desarmadas */
}

function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}
function today(){ return new Date().toISOString().slice(0,10); }
function plural(n, sing, pl){ return n + ' ' + (n === 1 ? sing : pl); }
function renderQuota(){
  var n = db.quota.date === today() ? db.quota.count : 0;
  $('#quota').textContent = n + '/100 hoy';
}
function bumpQuota(){
  if(db.quota.date !== today()) db.quota = {date:today(), count:0};
  db.quota.count++; save(); renderQuota();
}

/* Lo que va apoyado sobre la miniatura: cuanto dura, o que clase de cosa es
   cuando no dura nada. */
function marca(it){
  if(it.kind === 'radio')    return '<span class="chip envivo">EN VIVO</span>';
  if(it.kind === 'playlist') return '<span class="chip eslista">&#9654; ' +
                                    ((it.ytIds || []).length) + '</span>';
  return it.dura ? '<span class="chip">' + esc(it.dura) + '</span>' : '';
}

/* "1,2 M" antes que "1234567": el numero exacto no le importa a nadie, el
   orden de magnitud si. */
function vistas(n){
  n = +n || 0;
  if(!n) return '';
  if(n >= 1000000) return (n / 1000000).toFixed(n >= 10000000 ? 0 : 1).replace('.', ',') + ' M';
  if(n >= 1000)    return Math.round(n / 1000) + ' mil';
  return String(n);
}

/* La API da la duracion en ISO: PT1H2M3S. Un vivo llega como P0D, que no es
   una duracion sino "esto no termino", y ahi no se muestra nada. */
function duracion(iso){
  var m = /^P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/.exec(iso || '');
  if(!m) return '';
  var h = (+(m[1] || 0)) * 24 + (+(m[2] || 0)), mi = +(m[3] || 0), se = +(m[4] || 0);
  if(!h && !mi && !se) return '';
  function dos(n){ return (n < 10 ? '0' : '') + n; }
  return h ? h + ':' + dos(mi) + ':' + dos(se) : mi + ':' + dos(se);
}

/* search.list no trae ni las reproducciones ni la duracion: las dos hay que
   pedirlas aparte a videos.list, que cuesta 1 unidad para los 50 juntos. */
function traerDatos(items){
  var ids = items.map(function(it){ return it.id.videoId; }).join(',');
  if(!ids) return Promise.resolve(items);
  return fetch('https://www.googleapis.com/youtube/v3/videos?part=statistics,contentDetails&id=' +
               encodeURIComponent(ids) + '&key=' + encodeURIComponent(getKey()))
    .then(function(r){ return r.json(); })
    .then(function(d){
      var mapa = {};
      (d.items || []).forEach(function(v){
        mapa[v.id] = {
          vistas: +((v.statistics && v.statistics.viewCount) || 0),
          dura:   duracion(v.contentDetails && v.contentDetails.duration)
        };
      });
      items.forEach(function(it){
        var x = mapa[it.id.videoId] || {};
        it.vistas = x.vistas || 0;
        it.dura   = x.dura || '';
      });
      return items;
    })
    /* Si esto falla, la busqueda igual sirve: se muestra sin numeros. */
    .catch(function(){ return items; });
}

function porVistas(a, b){ return (b.vistas || 0) - (a.vistas || 0); }

/* Las miniaturas de un vivo mueren con la transmision.
   Sin fondo propio: se apoya en el color de .th, asi sirve en los dos temas. */
var PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent(
  "<svg xmlns='http://www.w3.org/2000/svg' width='96' height='72'>" +
  "<circle cx='48' cy='36' r='11' fill='none' stroke='#8a8a8a' stroke-width='2'/>" +
  "<circle cx='48' cy='36' r='3' fill='#8a8a8a'/></svg>");
function imgFallback(el){ el.onerror = null; el.src = PLACEHOLDER; }

/* Para una radio guardamos el avatar del canal: el logo de la emisora es
   estable, la miniatura del stream no. channels.list cuesta 1 unidad. */
function fetchChannelAvatar(channelId){
  return fetch('https://www.googleapis.com/youtube/v3/channels?part=snippet&id=' +
               encodeURIComponent(channelId) + '&key=' + encodeURIComponent(getKey()))
    .then(function(r){ return r.json(); })
    .then(function(d){
      var it = d.items && d.items[0];
      var t = it && it.snippet && it.snippet.thumbnails;
      var pick = t && (t.medium || t['default'] || t.high);
      return pick ? pick.url : null;
    })
    .catch(function(){ return null; });
}

/* ============ reproducidos ============
   Lo que abriste, no lo que buscaste. Sirve para volver a algo que pusiste
   ayer y no llegaste a guardar, sin gastar otra busqueda en encontrarlo.
   Dura tres dias y se limpia solo. */
var RECIENTES = '@recientes';
var DIAS = 3, VIDA = DIAS * 24 * 60 * 60 * 1000;

function podarReproducidos(){
  var limite = Date.now() - VIDA, antes = db.reproducidos.length;
  db.reproducidos = db.reproducidos.filter(function(r){ return r.cuando > limite; }).slice(0, 60);
  return db.reproducidos.length !== antes;
}

function anotarReproducido(item){
  /* Uno solo por cosa: si lo volves a abrir sube arriba con la hora nueva. */
  db.reproducidos = db.reproducidos.filter(function(r){ return r.ytId !== item.ytId; });
  var anotado = {
    ytId: item.ytId, kind: item.kind, title: item.title || '',
    channel: item.channel || '', thumb: item.thumb || '',
    dura: item.dura || '', cuando: Date.now()
  };
  /* De una lista hay que guardar los ids, o desde recientes no se puede
     volver a armar. */
  if(item.ytIds) anotado.ytIds = item.ytIds.slice(0, TOPE_LISTA);
  db.reproducidos.unshift(anotado);
  podarReproducidos();
  save();
}

/* "hace 20 min", "ayer", "hace 2 dias": lo justo para ubicarse. */
function hace(ts){
  var m = Math.round((Date.now() - ts) / 60000);
  if(m < 2)   return 'recien';
  if(m < 60)  return 'hace ' + m + ' min';
  var h = Math.round(m / 60);
  if(h < 24)  return 'hace ' + h + (h === 1 ? ' hora' : ' horas');
  var d = Math.round(h / 24);
  return d === 1 ? 'ayer' : 'hace ' + d + ' dias';
}

/* ============ lanzar a YouTube ============ */
/* Radio: el vivo actual del canal, aunque el stream se haya reiniciado. */
var TOPE_LISTA = 50;

/* A que app se le entrega lo que se dispara. Es del aparato, no del perfil:
   el telefono del auto puede ir a YouTube Music y la compu seguir en YouTube.

   Solo cambia para un video suelto. Una radio es una transmision en vivo y
   una lista es el truco de watch_videos, y ninguna de las dos existe en
   YouTube Music: esas siguen yendo a YouTube igual. */
function aMusic(){ return localStorage.getItem('mytbe.destino') === 'music'; }

var PAQUETE = {
  yt:    'com.google.android.youtube',
  music: 'com.google.android.apps.youtube.music'
};

/* YouTube arma una lista temporal al vuelo con watch_videos: contesta un
   redirect a watch?v=<primero>&list=TLGG..., y de ahi en mas encadena el solo,
   con su reproductor y su boton de siguiente. Sin timer, sin que mytbe tenga
   que quedarse despierta y sin gastar cuota: es una direccion, nada mas.
   La lista no queda guardada en la cuenta, que es justo lo que queremos. */
function urlFor(item){
  if(item.kind === 'video' && aMusic())
    return 'https://music.youtube.com/watch?v=' + item.ytId;
  if(item.kind === 'playlist')
    return 'https://www.youtube.com/watch_videos?video_ids=' +
           (item.ytIds || []).slice(0, TOPE_LISTA).join(',');
  return item.kind === 'radio'
    ? 'https://www.youtube.com/channel/' + item.ytId + '/live'
    : 'https://www.youtube.com/watch?v=' + item.ytId;
}
/* En Android un https lo agarra primero el navegador, y recien ahi el
   sistema pregunta si pasar a la app de YouTube. Un intent:// va derecho a
   la app: sin escala y sin cartel. Si la app no esta instalada, el propio
   intent cae al sitio web, que es para lo que sirve browser_fallback_url. */
function esAndroid(){ return /Android/i.test(navigator.userAgent); }

function intentDe(url){
  var app = url.indexOf('music.youtube.com') > -1 ? PAQUETE.music : PAQUETE.yt;
  return 'intent://' + url.replace('https://', '') +
         '#Intent;scheme=https;package=' + app + ';' +
         'S.browser_fallback_url=' + encodeURIComponent(url) + ';end';
}

/* A veces lo que conviene abrir y lo que conviene anotar no son lo mismo:
   de un vivo se abre el stream que tocaste, pero se anota el canal, que es
   lo que va a seguir sirviendo pasado manana. */
function launch(item, anotar){
  anotarReproducido(anotar || item);
  var url = urlFor(item);
  /* En Android no se abre pestana nueva: el sistema cambia de app y mytbe
     queda atras tal como estaba. Con una lista no: watch_videos es un
     redirect que la app no necesariamente sigue, y el navegador si. */
  if(esAndroid() && item.kind !== 'playlist') location.href = intentDe(url);
  else window.open(url, '_blank', 'noopener');
}

/* ============ arbol de carpetas ============
   Las carpetas siguen siendo una lista plana y cada una recuerda a su madre.
   Anidarlas de verdad complicaria la fusion entre dispositivos, que trabaja
   emparejando por id, y no daria nada a cambio. */
function hijasDe(id){
  return db.folders.filter(function(f){ return (f.padre || null) === (id || null); });
}
function carpetaPorId(id){
  return db.folders.filter(function(f){ return f.id === id; })[0] || null;
}
/* La rama de arriba de todo, que es la que se pinta como pestana. */
function raizDe(id){
  var f = carpetaPorId(id), guarda = 0;
  while(f && f.padre && guarda++ < 20) f = carpetaPorId(f.padre);
  return f ? f.id : (db.folders[0] && db.folders[0].id);
}
/* Desde la raiz hasta ella, para el rastro de migas. */
function rutaDe(id){
  var f = carpetaPorId(id), ruta = [], guarda = 0;
  while(f && guarda++ < 20){ ruta.unshift(f); f = f.padre ? carpetaPorId(f.padre) : null; }
  return ruta;
}
/* Todo lo que cuelga de ella, a cualquier profundidad. */
function descendientes(id){
  var hijas = hijasDe(id), todo = hijas.slice();
  hijas.forEach(function(h){ todo = todo.concat(descendientes(h.id)); });
  return todo;
}
/* Los nombres desde la carpeta abierta hasta esa hija, para el encabezado. */
function rutaRelativa(raizId, id){
  var nombres = [], empezo = false;
  rutaDe(id).forEach(function(c){
    if(empezo) nombres.push(c.name);
    if(c.id === raizId) empezo = true;
  });
  return nombres;
}

/* Sin tildes y en minuscula: buscar "clasica" tiene que encontrar "Clásica". */
function pelar(t){
  return String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
}

/* Arriba son SOLAPAS; adentro de una solapa, CARPETAS; adentro de una
   carpeta, SUBCARPETAS. Es el mismo dato con tres nombres segun donde este,
   y tenerlo en una funcion evita que la app lo llame distinto en cada lado. */
function tipoDe(f){
  var n = rutaDe(f.id).length;
  return n === 1 ? 'solapa' : (n === 2 ? 'carpeta' : 'subcarpeta');
}
function mayus(t){ return t.charAt(0).toUpperCase() + t.slice(1); }
/* Como se va a llamar lo que se cree adentro de esa. */
function tipoHijaDe(padreId){
  if(!padreId) return 'solapa';
  return rutaDe(padreId).length === 1 ? 'carpeta' : 'subcarpeta';
}

function cuentaDe(f){
  var n = f.items.length;
  descendientes(f.id).forEach(function(h){ n += h.items.length; });
  return n;
}

/* Nombre de la carpeta donde ya esta guardado ese id, o null. */
function carpetaDe(ytId){
  if(!ytId) return null;
  for(var i = 0; i < db.folders.length; i++){
    var hit = db.folders[i].items.some(function(x){ return x.ytId === ytId; });
    if(hit) return db.folders[i].name;
  }
  return null;
}

/* ============ estado de vista ============ */
var current = db.folders[0].id;   /* carpeta abierta */
var results = null;               /* si hay busqueda activa */
var modoOrden = false;            /* la lista guardada se esta reordenando */
/* Los elegidos a mano para una lista. Viven fuera de la carpeta a proposito:
   se pueden juntar de varias carpetas y hasta de varias solapas, y quedan en
   el orden en que se fueron tocando, que es el orden en que van a sonar. */
var modoElegir = false, elegidos = [];
/* Que carpeta esta elegida en la columna, por solapa. En memoria: es donde
   estas parado, no algo que valga la pena guardar. */
var elegida = {}, ladoAbierto = false, modoCarpetas = false, arrastrando = null;
var carpetaSel = null;   /* la carpeta marcada mientras se acomoda */

function posicionElegido(ytId){
  for(var i = 0; i < elegidos.length; i++) if(elegidos[i].ytId === ytId) return i;
  return -1;
}

function renderTabs(){
  /* Solo las de primer nivel: las de adentro se ven al entrar, y asi la fila
     no crece hasta volverse ilegible. */
  var raiz = raizDe(current);
  $('#tabs').innerHTML = hijasDe(null).map(function(f){
    return '<button class="tab' + (!results && f.id === raiz ? ' on' : '') +
           '" data-tab="' + esc(f.id) + '">' + esc(f.name) + '</button>';
  }).join('') +
    '<button class="tab' + (!results && current === RECIENTES ? ' on' : '') +
      '" data-tab="' + RECIENTES + '">Recientes</button>' +
    '<button class="tab nueva" data-newfolder title="Solapa nueva">+</button>';

  var activa = $('#tabs').querySelector('.tab.on');
  if(activa && activa.scrollIntoView) activa.scrollIntoView({block:'nearest', inline:'nearest'});
  sombrasTabs();
}

/* Los degradados de los costados se prenden solo del lado que quedo cortado. */
function sombrasTabs(){
  var t = $('#tabs'), w = t.parentNode;
  w.classList.toggle('hay-izq', t.scrollLeft > 2);
  w.classList.toggle('hay-der', t.scrollLeft + t.clientWidth < t.scrollWidth - 2);
}

function render(){
  completarDuras();
  barraLista();
  renderTabs();
  if(results)                 renderResults();
  else if(current === RECIENTES) renderRecientes();
  else                        renderFolder();
}

/* ---- recientes ---- */
function renderRecientes(){
  if(podarReproducidos()) save();
  var html = '';

  if(!db.reproducidos.length){
    html = '<div class="empty">Todavia no abriste nada.<br>' +
           'Lo que dispares queda aca ' + DIAS + ' dias, por si despues lo queres guardar.</div>';
  } else {
    html = db.reproducidos.map(function(r, i){
      var ya = carpetaDe(r.ytId);
      var elegible = modoElegir && r.kind === 'video';
      var marcado = elegible && posicionElegido(r.ytId) > -1;
      return '<div class="row compact' +
        (modoElegir ? ' eligiendo' : '') + (marcado ? ' marcado' : '') +
        (modoElegir && !elegible ? ' apagada' : '') + '"' +
        (elegible ? ' data-elegir="' + esc(r.ytId) + '" data-en=""' :
         modoElegir ? '' : ' data-abrir="' + i + '"') + '>' +
        '<div class="tapa">' +
          '<img class="th" src="' + esc(r.thumb || PLACEHOLDER) + '" alt="" onerror="imgFallback(this)">' +
          marca(r) +
        '</div>' +
        '<div class="info">' +
          '<p class="ttl">' + esc(r.title || 'Sin titulo') + '</p>' +
          '<div class="sub">' + esc(hace(r.cuando)) +
            (r.channel ? ' &middot; ' + esc(r.channel) : '') +
            (ya ? ' &middot; <span class="saved">&#10003; en ' + esc(ya) + '</span>' : '') +
          '</div>' +
        '</div>' +
        (modoElegir
          ? (elegible
              ? '<button class="add' + (marcado ? ' on' : '') + '">' +
                (marcado ? (posicionElegido(r.ytId) + 1) : '+') + '</button>'
              : '<span class="add vacio"></span>')
          : '<button class="add' + (ya ? ' on' : '') + '" data-guardar="' + i + '" title="' +
            (ya ? 'Ya esta en ' + esc(ya) : 'Guardar en una carpeta') + '">' +
            (ya ? '&#10003;' : '+') + '</button>') +
      '</div>';
    }).join('');
  }

  html += '<div class="foot">Lo abierto en los ultimos ' + DIAS + ' dias';
  if(db.reproducidos.length) html += ' &middot; <a data-vaciar>vaciar</a>';
  html += '</div>';

  $('#panel').innerHTML = html;
}

/* Los videos que se ven ahora mismo, en el orden en que se ven: primero los
   de cada carpeta y al final los sueltos. Las radios quedan afuera (son
   canales, no tienen un id de video estable) y las listas tambien. */
function videosVisibles(f){
  var buscado = pelar(filtro.trim()), filtrando = !!buscado;
  function sirve(it){
    if(it.kind !== 'video') return false;
    if(!filtrando) return true;
    return pelar(it.title).indexOf(buscado) > -1 || pelar(it.channel || '').indexOf(buscado) > -1;
  }
  var salida = [];
  (function recorrer(padre){
    hijasDe(padre).forEach(function(h){
      salida = salida.concat(h.items.filter(sirve));
      recorrer(h.id);
    });
  })(f.id);
  return salida.concat(f.items.filter(sirve));
}

/* Los videos de ese grupo tal como se estan viendo: si hay filtro puesto,
   solo los que pasaron el filtro. */
/* La duracion viene guardada como texto ("4:35"), asi que para sumarla hay
   que volver a desarmarla. Es barato y evita guardar el mismo dato dos veces. */
function aSegundos(t){
  var p = String(t || '').split(':').map(Number);
  if(p.length === 3) return (p[0] * 3600) + (p[1] * 60) + p[2];
  if(p.length === 2) return (p[0] * 60) + p[1];
  return 0;
}
function totalDe(items){
  var seg = items.reduce(function(a, i){ return a + aSegundos(i.dura); }, 0);
  if(!seg) return '';
  var h = Math.floor(seg / 3600), m = Math.round((seg % 3600) / 60);
  return h ? h + ' h ' + m + ' min' : m + ' min';
}

function videosDeGrupo(id){
  var c = carpetaPorId(id);
  if(!c) return [];
  var buscado = pelar(filtro.trim());
  return c.items.filter(function(it){
    if(it.kind !== 'video') return false;
    if(!buscado) return true;
    return pelar(it.title).indexOf(buscado) > -1 || pelar(it.channel || '').indexOf(buscado) > -1;
  });
}

/* Terminar el armado: se apaga solo despues de usar la lista, que es cuando
   uno ya termino. */
function salirDeLista(){
  modoElegir = false;
  elegidos = [];
  render();
}

function reproducirLista(items, nombre){
  if(!items.length) return;
  if(items.length > TOPE_LISTA){
    avisar('Son muchos', 'YouTube aguanta unos <b>' + TOPE_LISTA + '</b> por lista. ' +
           'Van los primeros ' + TOPE_LISTA + ', en el orden que se ven.');
  }
  launch({
    kind:'playlist', ytId:'tmp' + Date.now(), title:nombre,
    ytIds: items.slice(0, TOPE_LISTA).map(function(i){ return i.ytId; }),
    thumb: items[0].thumb || '', channel:''
  });
}

/* Lo que se guardo antes de que existiera la duracion no la tiene. Se
   completa sola: videos.list cuesta 1 unidad para 50 juntos, y a los que la
   API no conteste se les anota vacio para no volver a preguntar por ellos. */
var pidiendoDuras = false;

function completarDuras(){
  if(pidiendoDuras || !navigator.onLine || !getKey()) return;

  var faltan = [];
  db.folders.forEach(function(f){
    f.items.forEach(function(it){
      if(it.kind === 'video' && it.dura === undefined && faltan.length < 50) faltan.push(it);
    });
  });
  if(!faltan.length) return;

  pidiendoDuras = true;
  fetch('https://www.googleapis.com/youtube/v3/videos?part=contentDetails&id=' +
        encodeURIComponent(faltan.map(function(it){ return it.ytId; }).join(',')) +
        '&key=' + encodeURIComponent(getKey()))
    .then(function(r){ return r.json(); })
    .then(function(d){
      var mapa = {};
      (d.items || []).forEach(function(v){
        mapa[v.id] = duracion(v.contentDetails && v.contentDetails.duration);
      });
      faltan.forEach(function(it){ it.dura = mapa[it.ytId] || ''; });
      pidiendoDuras = false;
      save();
      render();          /* si quedan mas de 50, la proxima vuelta sigue */
    })
    .catch(function(){ pidiendoDuras = false; });
}

/* ---- carpeta ----
   Una sola forma de mirar una carpeta: la lista. Todo lo que cuelga de ella
   aparece de una tirada y cada subcarpeta es un encabezado que se queda
   pegado arriba, en vez de un lugar al que entrar y del que volver. */
var filtro = '';    /* lo tipeado en el campo de filtrar */

function renderFolder(){
  var f = carpetaPorId(current) || db.folders[0];
  current = f.id;
  if(!f.plegados) f.plegados = {};

  /* La columna aparece sola donde hay algo que navegar: una solapa con
     carpetas adentro. Radios o Podcast, que son una lista y nada mas, siguen
     exactamente como estaban. */
  var conLado = !f.padre && hijasDe(f.id).length > 0;
  var raiz = conLado ? (carpetaPorId(elegida[f.id]) || f) : f;
  if(conLado && !carpetaPorId(elegida[f.id])) elegida[f.id] = f.id;

  var buscado = pelar(filtro.trim()), filtrando = !!buscado;
  var hijas = hijasDe(raiz.id), total = cuentaDe(raiz);
  var html = '';

  /* El filtro aparece cuando hay algo que filtrar. En una carpeta de dos
     cosas seria un campo de mas. */
  if(conLado && modoCarpetas){
    $('#panel').innerHTML = pantallaAcomodar(f);
    return;
  }

  if(conLado){
    html += '<div class="dos">' + columnaCarpetas(f, raiz) + '<div class="tabla">' +
      '<button class="btnlado" data-verlado>' +
        '<span class="fl ' + (ladoAbierto ? 'abierta' : 'cerrada') + '"></span>' +
        esc(raiz.name) + '<span class="cn">' + plural(total, 'elemento', 'elementos') +
      '</span></button>';
  }

  if(total > 6 && !modoOrden){
    html += '<div class="filtro"><input type="text" id="filtro" placeholder="filtrar en ' +
            esc(raiz.name) + '" autocomplete="off" spellcheck="false" value="' + esc(filtro) + '"></div>';
  }

  function coincide(it){
    if(!filtrando) return true;
    return pelar(it.title).indexOf(buscado) > -1 || pelar(it.channel || '').indexOf(buscado) > -1;
  }

  function fila(it, duena, i, ultimo){
    /* Eligiendo, la fila deja de disparar y pasa a marcar. Lo que no es un
       video no se puede elegir: una radio no tiene id de video y una lista no
       entra adentro de otra. */
    var elegible = modoElegir && it.kind === 'video';
    var marcado = elegible && posicionElegido(it.ytId) > -1;

    return '<div class="row compact lista' +
           (modoOrden ? ' ordenando' : '') +
           (modoElegir ? ' eligiendo' : '') +
           (marcado ? ' marcado' : '') +
           (modoElegir && !elegible ? ' apagada' : '') + '"' +
           (modoOrden || modoElegir ? '' : ' data-open="' + esc(it.ytId) + '"') +
           (elegible ? ' data-elegir="' + esc(it.ytId) + '"' : '') +
           ' data-en="' + esc(duena.id) + '">' +
      '<div class="tapa">' +
        '<img class="th" src="' + esc(it.thumb || PLACEHOLDER) + '" alt="" onerror="imgFallback(this)">' +
        marca(it) +
      '</div>' +
      '<div class="info">' +
        '<p class="ttl">' + esc(it.title) + '</p>' +
        '<div class="sub">' +
          (it.kind === 'playlist'
            ? plural((it.ytIds || []).length, 'video', 'videos')
            : esc(it.channel || '')) +
        '</div>' +
      '</div>' +
      (modoOrden
        ? '<div class="ord">' +
            '<button data-up="' + i + '" data-en="' + esc(duena.id) + '" title="Subir"' +
              (i === 0 ? ' disabled' : '') + '>&#9650;</button>' +
            '<button data-down="' + i + '" data-en="' + esc(duena.id) + '" title="Bajar"' +
              (i === ultimo ? ' disabled' : '') + '>&#9660;</button>' +
          '</div>'
        : modoElegir
          ? (elegible
              ? '<button class="add' + (marcado ? ' on' : '') + '">' +
                (marcado ? (posicionElegido(it.ytId) + 1) : '+') + '</button>'
              : '<span class="add vacio"></span>')
          : '<button class="x" data-rm="' + esc(it.ytId) + '" data-en="' + esc(duena.id) +
            '" title="Eliminar">&times;</button>') +
    '</div>';
  }

  function filas(carpeta, items){
    var ultimo = items.length - 1;
    return items.map(function(it, i){ return fila(it, carpeta, i, ultimo); }).join('');
  }

  var grupos = 0, mostrados = 0;

  function botonNueva(c){
    return '<button class="masg" data-dentro2="' + esc(c.id) + '" title="' +
      esc(tipoHijaDe(c.id)) + ' nueva adentro de ' + esc(c.name) + '">+</button>';
  }

  function grupo(nombres, carpeta, propio){
    /* Ordenando trabajamos sobre la lista entera, sin filtrar: si no, las
       flechas moverian el vecino equivocado. */
    var items = modoOrden ? carpeta.items : carpeta.items.filter(coincide);
    if(filtrando && !items.length) return;      /* sin nada que ver, no ocupa lugar */
    grupos++;
    mostrados += items.length;

    var plegado = !filtrando && !modoOrden && !!f.plegados[carpeta.id];
    html += '<div class="grupo' + (plegado ? ' plegado' : '') + '" data-grupo="' + esc(carpeta.id) + '">' +
      '<span class="flecha">' + (plegado ? '&#9654;' : '&#9660;') + '</span>' +
      esc(nombres[0]) +
      (nombres.length > 1 ? ' <span class="ruta">&rsaquo; ' + esc(nombres.slice(1).join(' > ')) + '</span>' : '') +
      '<span class="n">' + items.length +
        (totalDe(items) ? ' &middot; ' + esc(totalDe(items)) : '') + '</span>' +
      /* Crear un nivel mas abajo sin salir de aca. En el grupo de los sueltos
         no va: ese no es una carpeta, es el resto. */
      (function(){
        var suyos = items.filter(function(i){ return i.kind === 'video'; });
        if(!suyos.length) return propio ? '' : botonNueva(carpeta);
        if(modoElegir){
          /* Armando una lista, el boton del grupo agrega o saca los suyos de
             una: veinte temas en un toque en vez de veinte. */
          var todos = suyos.every(function(i){ return posicionElegido(i.ytId) > -1; });
          return '<button class="masg ancho" data-todos="' + esc(carpeta.id) + '" title="' +
            (todos ? 'Sacar' : 'Agregar') + ' todo ' + esc(carpeta.name) + '">' +
            (todos ? '&#10003;' : '+') + ' todo</button>';
        }
        return '<button class="masg" data-play2="' + esc(carpeta.id) + '" title="Reproducir ' +
          esc(carpeta.name) + ' entera">&#9654;</button>' +
          (propio ? '' : botonNueva(carpeta));
      })() +
    '</div>';

    if(!plegado) html += filas(carpeta, items);
  }

  if(conLado){
    /* Con la columna al lado, el acordeon sobra: la jerarquia la maneja ella y
       aca abajo va una lista y nada mas, con todo lo que cuelga del alcance
       elegido. Dos controles para lo mismo era justamente el problema. */
    var todo = itemsDe(raiz).filter(function(x){ return modoOrden || coincide(x.it); });
    mostrados = todo.length;
    grupos = 0;
    html += todo.map(function(x, i){
      return fila(x.it, x.en, x.i, x.ultimo);
    }).join('');
  } else if(!hijas.length){
    /* Sin subcarpetas no hay nada que agrupar: las cosas, y listo. */
    var propios = modoOrden ? raiz.items : raiz.items.filter(coincide);
    mostrados = propios.length;
    html += filas(raiz, propios);
  } else {
    /* En el mismo orden en que cuelgan: cada una y despues las suyas. */
    (function recorrer(padre){
      hijasDe(padre).forEach(function(h){
        grupo(rutaRelativa(raiz.id, h.id), h);
        recorrer(h.id);
      });
    })(raiz.id);
    /* Lo suelto de la propia carpeta, al final, para que no quede sepultado. */
    if(raiz.items.length) grupo(['Sueltas en ' + raiz.name], raiz, true);
  }

  if(!total){
    modoOrden = false;
    html += '<div class="empty">Esta ' + esc(tipoDe(raiz)) + ' esta vacia.<br>' +
            'Busca algo arriba y toca <b>+</b> en el resultado.</div>';
  } else if(filtrando && !mostrados){
    html += '<div class="empty">Nada con <b>' + esc(filtro.trim()) + '</b> en ' + esc(raiz.name) + '.</div>';
  }

  html += '<div class="foot">';
  if(modoElegir){
    /* Lo que se hace con lo elegido vive en la barra de arriba, que se ve
       siempre; el pie se scrollea y ahi el boton se pierde. */
    html += 'Marca lo que quieras y usa la barra de arriba';
  } else if(modoOrden){
    html += 'Move cada uno con las flechas &middot; <a data-orden>listo</a>';
  } else if(filtrando){
    html += plural(mostrados, 'elemento', 'elementos') + ' con ese texto';
    if(videosVisibles(raiz).length > 1){
      html += ' &middot; <a data-playtodo>&#9654; reproducir</a>';
    }
  } else {
    html += plural(total, 'elemento', 'elementos');
    if(!conLado && hijas.length) html += ' en ' + plural(grupos, 'grupo', 'grupos');
    if(videosVisibles(raiz).length > 1){
      html += ' &middot; <a data-playtodo>&#9654; reproducir todo</a>';
    }
    html += ' &middot; <a data-nuevasub>' + esc(tipoHijaDe(raiz.id)) + ' nueva</a>';
    if(total > 1)             html += ' &middot; <a data-orden>ordenar</a>';
    if(db.folders.length > 1) html += ' &middot; <a data-delfolder>borrar ' + esc(tipoDe(raiz)) + '</a>';
  }
  html += '</div>';
  if(conLado) html += '</div></div>';

  $('#panel').innerHTML = html;
}

/* Todo lo que cuelga de una carpeta, con la duena de cada cosa al lado para
   que eliminar y ordenar sepan a quien tocarle. Primero lo suyo, despues lo
   de sus hijas, en el orden en que cuelgan. */
function itemsDe(c){
  var out = [];
  function meter(carpeta){
    var ultimo = carpeta.items.length - 1;
    carpeta.items.forEach(function(it, i){
      out.push({it:it, en:carpeta, i:i, ultimo:ultimo});
    });
  }
  meter(c);
  (function rec(padre){
    hijasDe(padre).forEach(function(h){ meter(h); rec(h.id); });
  })(c.id);
  return out;
}

/* La columna: la solapa entera arriba y despues su arbol, sangrado y sin
   repetir el nombre de la madre. */
function columnaCarpetas(solapa, raiz){
  var html = '<div class="lado' + (ladoAbierto ? ' abierto' : '') + '">';

  html += '<button class="cp' + (raiz.id === solapa.id ? ' on' : '') + '" data-alcance="' +
    esc(solapa.id) + '"><span class="nm">Todo ' + esc(solapa.name) + '</span>' +
    '<span class="cn">' + cuentaDe(solapa) + '</span></button>';
  html += '<div class="rayita"></div>';

  html += '<div class="cps">';
  (function nivel(padre, prof){
    hijasDe(padre).forEach(function(c){
      html += '<button class="cp' + (prof ? ' hija' : '') + (c.id === raiz.id ? ' on' : '') +
        '" data-alcance="' + esc(c.id) + '"><span class="nm">' + esc(c.name) + '</span>' +
        '<span class="cn">' + cuentaDe(c) + '</span></button>';
      nivel(c.id, prof + 1);
    });
  })(solapa.id, 0);
  html += '</div>';

  html += '<div class="ladopie"><button data-acomodar>acomodar</button></div>';
  html += '</div>';
  return html;
}

/* ---- la pantalla de acomodar ----
   Se marca una carpeta y los botones de abajo actuan sobre esa. Uno solo de
   cada cosa en vez de tres por fila: los nombres entran enteros y no importa
   cuantas carpetas haya. */
function pantallaAcomodar(solapa){
  var sel = carpetaPorId(carpetaSel);
  var hs = sel ? hijasDe(sel.padre || null) : [];
  var i = sel ? hs.indexOf(sel) : -1;

  var html = '<div class="acom"><p class="acomtit">Toca una carpeta y usa los botones de abajo. ' +
    'Con mouse tambien podes arrastrarla encima de otra para meterla adentro.</p><div class="acomlista">';

  (function nivel(padre, prof){
    hijasDe(padre).forEach(function(c){
      html += '<button class="ac' + (prof === 1 ? ' hija' : (prof > 1 ? ' hija2' : '')) +
        (c.id === carpetaSel ? ' sel' : '') + '" draggable="true" data-marcarc="' + esc(c.id) +
        '" data-arrastra="' + esc(c.id) + '">' +
        '<span class="nm">' + esc(c.name) + '</span>' +
        '<span class="cn">' + cuentaDe(c) + '</span></button>';
      nivel(c.id, prof + 1);
    });
  })(solapa.id, 0);

  html += '</div><div class="acombarra">' +
    '<button data-subec' + (i > 0 ? '' : ' disabled') + '>&#9650; subir</button>' +
    '<button data-bajac' + (sel && i < hs.length - 1 ? '' : ' disabled') + '>&#9660; bajar</button>' +
    '<button data-moverc' + (sel ? '' : ' disabled') + '>meter en&hellip;</button>' +
    '<button class="listo" data-acomodar>listo</button>' +
  '</div></div>';
  return html;
}

/* ---- acomodar carpetas ---- */
/* Las hermanas viven salteadas en db.folders, asi que subir una es cambiarla
   de lugar con la hermana anterior, no con el vecino del array. */
function moverCarpeta(id, paso){
  var c = carpetaPorId(id);
  var hs = hijasDe(c.padre || null);
  var i = hs.indexOf(c), j = i + paso;
  if(j < 0 || j >= hs.length) return;
  var a = db.folders.indexOf(c), b = db.folders.indexOf(hs[j]);
  db.folders[a] = hs[j];
  db.folders[b] = c;
  save();
  render();
}

/* Una carpeta no puede meterse adentro de si misma ni de una hija suya. */
function puedeIrA(id, destino){
  if(id === destino) return false;
  var r = rutaDe(destino);
  for(var i = 0; i < r.length; i++) if(r[i].id === id) return false;
  return true;
}

function meterEn(id, destino){
  if(!puedeIrA(id, destino)) return;
  var c = carpetaPorId(id);
  c.padre = (destino === '@raiz' ? null : destino);
  c.nombreEn = Date.now();
  save();
  render();
}

function askMoverCarpeta(id){
  var c = carpetaPorId(id);
  var solapa = rutaDe(id)[0];
  var opciones = '';
  (function nivel(padre, prof){
    hijasDe(padre).forEach(function(x){
      if(puedeIrA(id, x.id))
        opciones += '<button class="pick" data-destino="' + esc(x.id) + '"' +
          (prof ? ' style="padding-left:' + (10 + prof * 15) + 'px"' : '') + '>' +
          (prof ? '&rsaquo; ' : '') + esc(x.name) + '</button>';
      nivel(x.id, prof + 1);
    });
  })(solapa.id, 0);

  openModal(
    '<h3>Mover ' + esc(c.name) + '</h3><div class="body">' +
      '<p>Adentro de cual va?</p>' +
      '<button class="pick" data-destino="' + esc(solapa.id) + '">' +
        esc(solapa.name) + ' <small>al primer nivel</small></button>' +
      opciones +
      '<button class="close" data-cancel>Cancelar</button>' +
    '</div>',
    function(e){
      if(e.target.closest('[data-cancel]')){ closeModal(); return; }
      var d = e.target.closest('[data-destino]');
      if(d){ closeModal(); meterEn(id, d.dataset.destino); }
    });
}

/* Re-dibujar el panel se lleva puesto el foco del campo: hay que devolverlo
   con el cursor donde estaba, o no se puede escribir de corrido. */
function refiltrar(){
  renderFolder();
  var i = $('#filtro');
  if(i){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
}

/* ---- resultados ---- */
function renderResults(){

    /* Un vivo se puede haber guardado como canal o como video: miramos los dos. */

      '<img class="th" src="' + esc(th) + '" alt="" onerror="imgFallback(this)">' +
