<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dfe6ec">
<title>mytbe</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="mytbe">
<script>
/* Antes de pintar nada, para que no pegue un flash blanco al abrir de noche. */
(function(){
  try{
    var t = localStorage.getItem('mytbe.tema');
    if(t) document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>
<style>
/* ===========================================================
   Estetica YouTube 2005: Arial chica, cajas plateadas con
   biselado, links azules subrayados, barra celeste de formulario.

   Los colores son variables porque hay dos paletas. El modo oscuro
   no invierte: reinterpreta el plateado y el celeste en tonos frios
   oscuros, y aclara el rojo y el azul de los links, que a #cc181e y
   #0000cc quedarian ilegibles sobre fondo negro.
   =========================================================== */
:root{
  --page:#dfe6ec; --panel:#fff;
  --ink:#000; --ink-2:#525c66; --ink-3:#6f6f6f; --ink-4:#555;
  --line:#e2e2e2; --edge:#9a9a9a;
  --link:#0000cc; --link-v:#551a8b;
  --red:#cc181e; --red-text:#cc181e; --green:#2e7d32;
  --bar:#c6d9ef; --bar-line:#a8bed2;
  --field:#fff; --field-edge:#7f9db9; --field-focus:#4a76a8;
  --btn-a:#fdfdfd; --btn-b:#dcdcdc; --btn-edge:#8c8c8c; --btn-ink:#1b1b1b;
  --btn-a2:#d0d0d0; --btn-b2:#e8e8e8;
  --tab-a:#fcfcfc; --tab-b:#cfcfcf; --tab-ink:#4d4d4d;
  --thumb:#ececec; --thumb-edge:#999;
  --row-hit:#eaf1fa; --x-ink:#767676; --x-hit:#f0f0f0;
  --title-a:#5b87b8; --title-b:#3d6a9c; --box-edge:#7a7a7a;
  --sel-bg:#fff8f8; --logo-ink:#1b1b1b; --foot-ink:#6b7a86;
  --shadow:rgba(0,0,0,.35); --veil:rgba(0,0,0,.45);
}
/* Sistema en oscuro, salvo que el usuario haya elegido claro a mano */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#171b21; --panel:#10141a;
    --ink:#dfe4ea; --ink-2:#97a2ad; --ink-3:#7d8894; --ink-4:#8b96a1;
    --line:#262d36; --edge:#39424d;
    --link:#7fb2ff; --link-v:#c4a7e7;
    --red:#cc181e; --red-text:#ff5f5f; --green:#6fbf73;
    --bar:#1e2c3d; --bar-line:#3a4d64;
    --field:#0b0e12; --field-edge:#46596e; --field-focus:#6f9fd0;
    --btn-a:#39414b; --btn-b:#272d35; --btn-edge:#4a545f; --btn-ink:#d3d9df;
    --btn-a2:#222831; --btn-b2:#333a44;
    --tab-a:#333b45; --tab-b:#232931; --tab-ink:#a9b3bd;
    --thumb:#232931; --thumb-edge:#3d4650;
    --row-hit:#1c2734; --x-ink:#7d8894; --x-hit:#232931;
    --title-a:#2f4b6b; --title-b:#22374f; --box-edge:#3d4650;
    --sel-bg:#2a1a1c; --logo-ink:#e8ecef; --foot-ink:#6d7883;
    --shadow:rgba(0,0,0,.6); --veil:rgba(0,0,0,.65);
  }
}
/* Eleccion explicita del usuario, gana en los dos sentidos */
:root[data-theme="dark"]{
  --page:#171b21; --panel:#10141a;
  --ink:#dfe4ea; --ink-2:#97a2ad; --ink-3:#7d8894; --ink-4:#8b96a1;
  --line:#262d36; --edge:#39424d;
  --link:#7fb2ff; --link-v:#c4a7e7;
  --red:#cc181e; --red-text:#ff5f5f; --green:#6fbf73;
  --bar:#1e2c3d; --bar-line:#3a4d64;
  --field:#0b0e12; --field-edge:#46596e; --field-focus:#6f9fd0;
  --btn-a:#39414b; --btn-b:#272d35; --btn-edge:#4a545f; --btn-ink:#d3d9df;
  --btn-a2:#222831; --btn-b2:#333a44;
  --tab-a:#333b45; --tab-b:#232931; --tab-ink:#a9b3bd;
  --thumb:#232931; --thumb-edge:#3d4650;
  --row-hit:#1c2734; --x-ink:#7d8894; --x-hit:#232931;
  --title-a:#2f4b6b; --title-b:#22374f; --box-edge:#3d4650;
  --sel-bg:#2a1a1c; --logo-ink:#e8ecef; --foot-ink:#6d7883;
  --shadow:rgba(0,0,0,.6); --veil:rgba(0,0,0,.65);
}

/* Dos colores que faltaban: el azul que reemplaza al rojo en el segmentado
   (el rojo queda solo para EN VIVO y el logo) y el rojo de los botones que
   destruyen algo. Se definen aparte para no repetir las tres paletas. */
:root{--sel:#3d6a9c; --peligro-a:#d95459; --peligro-b:#b81f26; --peligro-edge:#8f181e}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--sel:#3f6da4; --peligro-a:#7d2a2e; --peligro-b:#5d1e21; --peligro-edge:#8c3a3e}
}
:root[data-theme="dark"]{--sel:#3f6da4; --peligro-a:#7d2a2e; --peligro-b:#5d1e21; --peligro-edge:#8c3a3e}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--page);
  font:13px/1.4 Arial,Helvetica,sans-serif;
  color:var(--ink);
  padding:8px 8px 24px;
}
a{color:var(--link);text-decoration:underline;cursor:pointer}
a:visited{color:var(--link-v)}

.shell{max-width:680px;margin:0 auto}

/* ---- encabezado ---- */
.top{display:flex;align-items:flex-end;gap:10px;padding:2px 4px 6px}
.logo{font:italic 900 27px/0.9 Arial,Helvetica,sans-serif;letter-spacing:-1px;white-space:nowrap}
.logo .a{color:var(--logo-ink)}
.logo .b{
  color:#fff;background:var(--red);border-radius:7px;
  padding:2px 6px 3px;margin-left:2px;display:inline-block
}
.topright{margin-left:auto;text-align:right;font-size:11px;color:var(--ink-4);line-height:1.6}
.topright a{font-size:11px;margin-left:7px}

/* ---- pestanas ---- */
.tabswrap{position:relative}
/* Sin esto, con cinco carpetas la sexta no existe: la barra esta oculta y
   nada avisa que hay mas al costado. Cada degradado aparece solo del lado
   donde efectivamente quedo contenido cortado. */
.tabswrap::before,.tabswrap::after{
  content:"";position:absolute;top:0;bottom:0;width:24px;z-index:3;
  pointer-events:none;opacity:0;transition:opacity .15s}
.tabswrap::before{left:0;background:linear-gradient(90deg,var(--page),transparent)}
.tabswrap::after{right:0;background:linear-gradient(270deg,var(--page),transparent)}
.tabswrap.hay-izq::before,.tabswrap.hay-der::after{opacity:1}
@media (prefers-reduced-motion:reduce){.tabswrap::before,.tabswrap::after{transition:none}}
.tabs{display:flex;gap:2px;overflow-x:auto;white-space:nowrap;
  padding:0 2px;scrollbar-width:none;scroll-behavior:smooth}
.tabs .tab{scroll-snap-align:end}
.tabs::-webkit-scrollbar{display:none}
.tab{
  font:bold 11px/1 Arial,Helvetica,sans-serif;letter-spacing:.08em;
  color:var(--tab-ink);background:linear-gradient(var(--tab-a),var(--tab-b));
  border:1px solid var(--edge);border-bottom:none;border-radius:6px 6px 0 0;
  padding:15px 14px 14px;cursor:pointer;flex:none;text-transform:uppercase
}
.tab.on{background:var(--panel);color:var(--ink);padding-bottom:15px;position:relative;z-index:2}
.tab.nueva{font-size:15px;letter-spacing:0;padding:13px 14px 12px;color:var(--ink-2)}

/* ---- barra celeste ---- */
.bluebar{
  background:var(--bar);border:1px solid var(--edge);border-radius:0 6px 0 0;
  padding:10px 12px;margin-top:-1px;position:relative;z-index:1
}
.row1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row1 label{font-weight:bold;font-size:12px}
input[type=text]{
  flex:1;min-width:120px;background:var(--field);border:1px solid var(--field-edge);
  padding:6px 5px;font:16px Arial,Helvetica,sans-serif;color:var(--ink);border-radius:0
}
input[type=text]:focus{outline:1px solid var(--field-focus)}
button{
  font:bold 12px Arial,Helvetica,sans-serif;color:var(--btn-ink);
  background:linear-gradient(var(--btn-a),var(--btn-b));border:1px solid var(--btn-edge);
  border-radius:3px;padding:11px 14px;cursor:pointer
}
button:active{background:linear-gradient(var(--btn-a2),var(--btn-b2))}
.row2{margin-top:8px;font-size:12px;text-align:center;line-height:2}
select{
  font:12px Arial,Helvetica,sans-serif;background:var(--field);color:var(--ink);
  border:1px solid var(--field-edge);padding:3px 2px;margin:0 3px;border-radius:0;max-width:46vw
}

/* ---- panel ---- */
.panel{
  background:var(--panel);border:1px solid var(--edge);border-top:none;
  border-radius:0 0 12px 12px;padding:14px 12px;min-height:220px
}
.crumb{font-size:11px;color:var(--ink-4);margin:-4px 0 12px}

/* ---- filas de contenido ----
   La fila entera dispara. El texto conserva el aspecto de link chico de 2005,
   pero el area tactil es toda la fila: se usa a oscuras y con una mano. */
.row{display:flex;gap:10px;padding:12px 4px;margin:0 -4px;
  border-bottom:1px solid var(--line);align-items:flex-start;cursor:pointer}
.row:last-of-type{border-bottom:none}
.row:active{background:var(--row-hit)}
.th{width:96px;height:72px;flex:none;border:1px solid var(--thumb-edge);
  background:var(--thumb);object-fit:cover}
.info{flex:1;min-width:0}
/* El titulo era azul de link a 13px y competia con las acciones, que tambien
   son azules. Ahora es tinta plena a 15px: el azul quedo para lo que se toca
   aparte, y el subrayado solo aparece al presionar la fila. */
.ttl{font-size:15px;font-weight:bold;line-height:1.25;margin:0 0 4px;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row:active .ttl{text-decoration:underline}
.chan{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:11px;color:var(--ink-2);line-height:1.6}
.sub b{color:var(--ink-3)}
.live{color:var(--red-text);font-weight:bold}

/* Antes "guardar" era un link de 11px DENTRO de la fila que dispara: el
   toque impreciso abria YouTube cuando querias guardar. Ahora tiene columna
   propia de 44x44 a la derecha, igual que la X de la lista guardada. */
.add{width:44px;height:44px;flex:none;align-self:center;padding:0;
  font:bold 20px/1 Arial,Helvetica,sans-serif;color:var(--btn-ink);
  background:linear-gradient(var(--btn-a),var(--btn-b));
  border:1px solid var(--btn-edge);border-radius:3px}
.add:active{background:linear-gradient(var(--btn-a2),var(--btn-b2))}
.add.on{background:none;border-color:var(--green);color:var(--green);font-size:17px}
.saved{color:var(--green)}

/* ---- lista guardada: compacta, para ver muchas de un vistazo ----
   Sigue midiendo mas de 50px de alto, que es lo minimo para tocar sin mirar. */
.row.compact{padding:6px 4px;align-items:center;gap:9px}
.row.compact .th{width:54px;height:40px}
.row.compact .ttl{-webkit-line-clamp:1;margin:0 0 1px}
.row.compact .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-size:10.5px;line-height:1.5}
.x{background:none;border:none;color:var(--x-ink);font-size:19px;line-height:1;
  padding:9px 7px;flex:none;border-radius:3px}
.x:active{background:var(--x-hit);color:var(--red-text)}

/* Modo ordenar: mientras esta prendido la fila no dispara, asi que mover una
   radio no puede terminar en YouTube por accidente. */
.ord{display:flex;flex-direction:column;gap:3px;flex:none}
.ord button{width:40px;height:25px;padding:0;font-size:9px;border-radius:3px}
.ord button:disabled{opacity:.35}
.row.ordenando{cursor:default;background:var(--row-hit)}

.more{text-align:center;padding:16px 0 4px}
.more button{width:100%;max-width:280px}
.empty{color:var(--ink-3);font-size:12px;text-align:center;padding:46px 14px;line-height:1.7}
.empty .errt{display:block;color:var(--ink);font-size:14px;margin-bottom:6px}
.empty button{margin-top:12px}
.det{margin-top:16px;font-size:11px;color:var(--ink-3);text-align:left}
.det summary{cursor:pointer;color:var(--link);margin-bottom:6px}

/* P7: cinta de sin conexion, entre la barra de busqueda y el panel */
.cinta{background:var(--bar);border:1px solid var(--edge);border-top:none;
  font-size:11px;color:var(--ink-4);padding:7px 12px;text-align:center}
.cinta[hidden]{display:none}
.foot{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);
  font-size:11px;color:var(--ink-3)}
/* Pie de pagina, como los del sitio de la epoca */
.pagefoot{text-align:center;font-size:11px;color:var(--foot-ink);padding:14px 8px 4px;line-height:2}
.pagefoot a{margin:0 4px;padding:4px 2px;display:inline-block}
.loading{text-align:center;padding:44px;color:var(--ink-3);font-size:12px}

/* ---- modal ---- */
.modal{position:fixed;inset:0;z-index:50;background:var(--veil);
  display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.box{background:var(--panel);border:1px solid var(--box-edge);max-width:380px;width:100%;
  box-shadow:0 4px 18px var(--shadow)}
.box h3{margin:0;font-size:12px;font-weight:bold;color:#fff;letter-spacing:.04em;
  background:linear-gradient(var(--title-a),var(--title-b));padding:8px 11px;text-transform:uppercase}
.box .body{padding:13px}
.box p{margin:0 0 11px;font-size:12px;color:var(--ink-2);line-height:1.5}
.pick{display:block;width:100%;text-align:left;margin-bottom:6px;padding:9px 10px;
  font:12px Arial,Helvetica,sans-serif;font-weight:normal}
.pick b{display:block;font-size:12px;margin-bottom:2px}
.pick.sel{border:2px solid var(--red);background:var(--sel-bg)}
.pick small{display:block;color:var(--ink-3);font-size:10.5px;margin-top:2px}
.pick.nueva,.pick.volver{text-align:center;color:var(--link);background:var(--panel)}
.pick.nueva{border-style:dashed}
.hint{font-size:11px;color:var(--ink-2);margin:10px 0 6px;font-weight:bold}
.box .close{width:100%;margin-top:4px}
.box .close.peligro{color:#fff;border-color:var(--peligro-edge);
  background:linear-gradient(var(--peligro-a),var(--peligro-b))}

/* Control segmentado radio / stream, en lugar de dos botones grandes */
.seg{display:flex;border:1px solid var(--field-edge);border-radius:3px;overflow:hidden;margin-bottom:7px}
.seg button{flex:1;border:none;border-radius:0;padding:11px 6px;font-size:12px;
  color:var(--tab-ink);background:linear-gradient(var(--tab-a),var(--tab-b))}
.seg button + button{border-left:1px solid var(--bar-line)}
/* Era rojo, igual que EN VIVO y que el logo: tres cosas distintas con el
   mismo color. El rojo se quedo con el vivo; la seleccion pasa al azul. */
.seg button.on{background:var(--sel);color:#fff;font-weight:bold}
.box p.segnote{font-size:11px;color:var(--ink-3);margin:0 0 13px;line-height:1.45}

.newf{display:flex;gap:6px;margin-bottom:6px}
.newf input{flex:1;min-width:0}
</style>
</head>
<body>

<div class="shell">

  <div class="top">
    <div class="logo"><span class="a">my</span><span class="b">tbe</span></div>
    <div class="topright">
      <span id="quota">0/100 hoy</span><br>
      <a id="themelink">modo oscuro</a><a id="keylink">clave</a>
    </div>
  </div>

  <div class="tabswrap"><div class="tabs" id="tabs"></div></div>

  <div class="bluebar">
    <div class="row1">
      <label for="q">Buscar:</label>
      <input type="text" id="q" autocomplete="off" spellcheck="false" enterkeyhint="search">
      <button id="go">Buscar</button>
    </div>
    <div class="row2">
      Quiero
      <select id="f-live">
        <option value="">cualquier video</option>
        <option value="live">solo en vivo</option>
      </select>
      que dure
      <select id="f-long">
        <option value="">lo que sea</option>
        <option value="long">mas de 20 min</option>
      </select>
    </div>
  </div>

  <div class="cinta" id="cinta" hidden>Sin conexion &middot; las carpetas se abren igual, buscar no</div>

  <div class="panel" id="panel"></div>

  <div class="pagefoot">
    respaldo: <a id="exp">descargar copia</a> &middot; <a id="imp">restaurar copia</a>
  </div>
  <input type="file" id="file" accept="application/json,.json" hidden>

</div>

<div class="modal" id="modal" hidden><div class="box" id="box"></div></div>

<script>
/* ============ almacenamiento ============ */
var LS = 'mytbe.v1';
/* La app se llamaba "disparador" durante el desarrollo: si quedo algo
   guardado con las claves viejas, lo pasamos una sola vez y las borramos. */
(function migrar(){
  if(localStorage.getItem(LS)) return;
  var viejo = localStorage.getItem('disparador.v1');
  if(viejo){ localStorage.setItem(LS, viejo); localStorage.removeItem('disparador.v1'); }
  var k = localStorage.getItem('disparador.key');
  if(k && !localStorage.getItem('mytbe.key')){
    localStorage.setItem('mytbe.key', k); localStorage.removeItem('disparador.key');
  }
})();
function defaults(){
  return {
    folders: [
      {id:'radios',       name:'Radios',       items:[]},
      {id:'documentales', name:'Documentales', items:[]},
      {id:'verdespues',   name:'Ver despues',  items:[]}
    ],
    quota: {date:'', count:0}
  };
}
var db;
try { db = JSON.parse(localStorage.getItem(LS)) || defaults(); }
catch(e){ db = defaults(); }
if(!db || !db.folders || !db.folders.length) db = defaults();
if(!db.quota) db.quota = {date:'', count:0};
function save(){ localStorage.setItem(LS, JSON.stringify(db)); }

function getKey(){ return localStorage.getItem('mytbe.key') || ''; }
function setKey(k){ localStorage.setItem('mytbe.key', k.trim()); }
function claveValida(k){ return k.indexOf('AIza') === 0 && k.length >= 20; }

/* La clave puede viajar en el enlace: .../mytbe/#k=AIza...
   Asi se pone en un telefono nuevo sin volver a tipearla. La sacamos de la
   barra apenas la guardamos, para que no quede a la vista ni en el historial. */
function claveDelEnlace(){
  var m = /[#&]k=([^&]*)/.exec(location.hash || '');
  if(!m) return;
  var k;
  try { k = decodeURIComponent(m[1]).trim(); } catch(e){ k = ''; }
  if(claveValida(k)) setKey(k);
  if(history.replaceState) history.replaceState(null, '', location.pathname + location.search);
  else location.hash = '';
}
claveDelEnlace();
/* Si la app ya estaba abierta y pegan el enlace, cambia el hash sin recargar. */
window.addEventListener('hashchange', claveDelEnlace);

/* Sin esto, iOS y Android pueden barrer el localStorage de un sitio que no se
   abre hace unos dias, y la clave se pierde sola aunque este bien guardada. */
if(navigator.storage && navigator.storage.persist){
  try { navigator.storage.persist(); } catch(e){}
}

/* ============ utilidades ============ */
function $(s){ return document.querySelector(s); }
function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}
function today(){ return new Date().toISOString().slice(0,10); }
function plural(n, sing, pl){ return n + ' ' + (n === 1 ? sing : pl); }
function renderQuota(){
  var n = db.quota.date === today() ? db.quota.count : 0;
  $('#quota').textContent = n + '/100 hoy';
}
function bumpQuota(){
  if(db.quota.date !== today()) db.quota = {date:today(), count:0};
  db.quota.count++; save(); renderQuota();
}

/* Las miniaturas de un vivo mueren con la transmision.
   Sin fondo propio: se apoya en el color de .th, asi sirve en los dos temas. */
var PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent(
  "<svg xmlns='http://www.w3.org/2000/svg' width='96' height='72'>" +
  "<circle cx='48' cy='36' r='11' fill='none' stroke='#8a8a8a' stroke-width='2'/>" +
  "<circle cx='48' cy='36' r='3' fill='#8a8a8a'/></svg>");
function imgFallback(el){ el.onerror = null; el.src = PLACEHOLDER; }

/* Para una radio guardamos el avatar del canal: el logo de la emisora es
   estable, la miniatura del stream no. channels.list cuesta 1 unidad. */
function fetchChannelAvatar(channelId){
  return fetch('https://www.googleapis.com/youtube/v3/channels?part=snippet&id=' +
               encodeURIComponent(channelId) + '&key=' + encodeURIComponent(getKey()))
    .then(function(r){ return r.json(); })
    .then(function(d){
      var it = d.items && d.items[0];
      var t = it && it.snippet && it.snippet.thumbnails;
      var pick = t && (t.medium || t['default'] || t.high);
      return pick ? pick.url : null;
    })
    .catch(function(){ return null; });
}

/* ============ lanzar a YouTube ============ */
/* Radio: el vivo actual del canal, aunque el stream se haya reiniciado. */
function urlFor(item){
  return item.kind === 'radio'
    ? 'https://www.youtube.com/channel/' + item.ytId + '/live'
    : 'https://www.youtube.com/watch?v=' + item.ytId;
}
function launch(item){
  window.open(urlFor(item), '_blank', 'noopener');
}

/* Nombre de la carpeta donde ya esta guardado ese id, o null. */
function carpetaDe(ytId){
  if(!ytId) return null;
  for(var i = 0; i < db.folders.length; i++){
    var hit = db.folders[i].items.some(function(x){ return x.ytId === ytId; });
    if(hit) return db.folders[i].name;
  }
  return null;
}

/* ============ estado de vista ============ */
var current = db.folders[0].id;   /* carpeta abierta */
var results = null;               /* si hay busqueda activa */
var modoOrden = false;            /* la lista guardada se esta reordenando */

function renderTabs(){
  $('#tabs').innerHTML = db.folders.map(function(f){
    return '<button class="tab' + (!results && f.id === current ? ' on' : '') +
           '" data-tab="' + esc(f.id) + '">' + esc(f.name) + '</button>';
  }).join('') + '<button class="tab nueva" data-newfolder title="Nueva carpeta">+</button>';

  var activa = $('#tabs').querySelector('.tab.on');
  if(activa && activa.scrollIntoView) activa.scrollIntoView({block:'nearest', inline:'nearest'});
  sombrasTabs();
}

/* Los degradados de los costados se prenden solo del lado que quedo cortado. */
function sombrasTabs(){
  var t = $('#tabs'), w = t.parentNode;
  w.classList.toggle('hay-izq', t.scrollLeft > 2);
  w.classList.toggle('hay-der', t.scrollLeft + t.clientWidth < t.scrollWidth - 2);
}

function render(){
  renderTabs();
  results ? renderResults() : renderFolder();
}

/* ---- carpeta ---- */
function renderFolder(){
  var f = db.folders.filter(function(x){ return x.id === current; })[0] || db.folders[0];
  current = f.id;
  var html = '';

  if(!f.items.length){
    modoOrden = false;
    html = '<div class="empty">Esta carpeta esta vacia.<br>' +
           'Busca algo arriba y toca <b>+</b> en el resultado.</div>';
  } else {
    var ultimo = f.items.length - 1;
    html = f.items.map(function(it, i){
      /* Mientras se ordena la fila deja de disparar: mover una radio no puede
         terminar en YouTube por un toque de mas. */
      return '<div class="row compact' + (modoOrden ? ' ordenando' : '') + '"' +
             (modoOrden ? '' : ' data-open="' + esc(it.ytId) + '"') + '>' +
        '<img class="th" src="' + esc(it.thumb || PLACEHOLDER) + '" alt="" onerror="imgFallback(this)">' +
        '<div class="info">' +
          '<p class="ttl">' + esc(it.title) + '</p>' +
          '<div class="sub">' +
            (it.kind === 'radio' ? '<span class="live">en vivo</span>' : esc(it.channel)) +
          '</div>' +
        '</div>' +
        (modoOrden
          ? '<div class="ord">' +
              '<button data-up="' + i + '" title="Subir"' + (i === 0 ? ' disabled' : '') + '>&#9650;</button>' +
              '<button data-down="' + i + '" title="Bajar"' + (i === ultimo ? ' disabled' : '') + '>&#9660;</button>' +
            '</div>'
          : '<button class="x" data-rm="' + esc(it.ytId) + '" title="Eliminar">&times;</button>') +
      '</div>';
    }).join('');
  }

  html += '<div class="foot">';
  if(modoOrden){
    html += 'Move cada uno con las flechas &middot; <a data-orden>listo</a>';
  } else {
    html += plural(f.items.length, 'elemento', 'elementos') + ' en esta carpeta';
    if(f.items.length > 1)    html += ' &middot; <a data-orden>ordenar</a>';
    if(db.folders.length > 1) html += ' &middot; <a data-delfolder>borrar carpeta</a>';
  }
  html += '</div>';

  $('#panel').innerHTML = html;
}

/* ---- resultados ---- */
function renderResults(){
  var f = db.folders.filter(function(x){ return x.id === current; })[0];
  var html = '<div class="crumb">Resultados de <b>' + esc(results.q) + '</b> &middot; ' +
             '<a data-back>volver a ' + esc(f.name) + '</a></div>';

  html += results.items.map(function(it, i){
    var s = it.snippet, live = s.liveBroadcastContent === 'live';
    var th = (s.thumbnails && s.thumbnails.medium && s.thumbnails.medium.url) || PLACEHOLDER;
    /* Un vivo se puede haber guardado como canal o como video: miramos los dos. */
    var ya = carpetaDe(it.id.videoId) || carpetaDe(s.channelId);
    return '<div class="row" data-play="' + i + '">' +
      '<img class="th" src="' + esc(th) + '" alt="" onerror="imgFallback(this)">' +
      '<div class="info">' +
        '<p class="ttl">' + esc(s.title) + '</p>' +
        '<div class="sub">' + (live ? '<span class="live">EN VIVO</span> &middot; ' : '') +
          'de <b>' + esc(s.channelTitle) + '</b>' +
          (ya ? ' &middot; <span class="saved">&#10003; en ' + esc(ya) + '</span>' : '') +
        '</div>' +
      '</div>' +
      '<button class="add' + (ya ? ' on' : '') + '" data-save="' + i + '" title="' +
        (ya ? 'Ya esta en ' + esc(ya) + '. Tocalo para guardarlo tambien en otra carpeta'
            : 'Guardar') + '">' + (ya ? '&#10003;' : '+') + '</button>' +
    '</div>';
  }).join('');

  /* La API entrega el token de la pagina siguiente; solo cuando existe hay mas. */
  if(results.next) html += '<div class="more"><button data-more>traer 50 mas</button></div>';

  $('#panel').innerHTML = html;
}

/* ============ errores ============
   La API contesta en ingles y con vocabulario de API. Traducimos por el
   "reason", que es lo unico estable: el texto de Google cambia sin aviso. */
function traducirError(err){
  var api = (err && err.api && err.api.error) || {};
  var razon = (api.errors && api.errors[0] && api.errors[0].reason) || '';
  var texto = api.message || (err && err.message) || '';

  if(razon === 'quotaExceeded' || razon === 'dailyLimitExceeded')
    return {t:'Se acabo la cuota de hoy',
            p:'La clave da unas 100 busquedas por dia y se renueva a las 4 de la manana. Lo que tenes guardado se abre igual.'};

  if(razon === 'keyInvalid' || texto.indexOf('API key not valid') > -1)
    return {t:'La clave no sirve',
            p:'Puede estar mal copiada, o borrada en Google Cloud.', clave:true};

  if(razon === 'ipRefererBlocked')
    return {t:'Google rechazo la clave desde aca',
            p:'La clave tiene una restriccion que no incluye a este sitio.', clave:true};

  if(razon === 'accessNotConfigured')
    return {t:'Falta habilitar la API',
            p:'En Google Cloud hay que activar YouTube Data API v3 para este proyecto.'};

  return {t:'No se pudo buscar', p:'', detalle:texto};
}

function mostrarError(m){
  var html = '<div class="empty"><b class="errt">' + esc(m.t) + '</b>';
  if(m.p)       html += esc(m.p);
  if(m.clave)   html += '<br><button data-abrirclave>Cambiar la clave</button>';
  if(m.detalle) html += '<details class="det"><summary>detalle tecnico</summary>' + esc(m.detalle) + '</details>';
  $('#panel').innerHTML = html + '</div>';
}

/* ============ busqueda ============
   Sin token trae la primera pagina; con token agrega la siguiente abajo,
   sin perder lo que ya estabas mirando. */
function doSearch(token){
  var q = token ? results.q : $('#q').value.trim();
  if(!q) return;
  if(!getKey()){ askKey(); return; }
  if(!navigator.onLine){
    mostrarError({t:'Estas sin conexion',
                  p:'Las carpetas guardadas se abren igual; buscar necesita senal.'});
    return;
  }

  var boton = token ? $('#panel').querySelector('[data-more]') : null;
  if(boton){ boton.disabled = true; boton.textContent = 'buscando...'; }
  else $('#panel').innerHTML = '<div class="loading">Buscando&hellip;</div>';

  var liveOnly = token ? results.liveOnly : $('#f-live').value === 'live';
  var largo    = token ? results.largo    : $('#f-long').value === 'long';

  /* 50 es el maximo que permite la API y cuesta lo mismo que pedir 25. */
  var p = new URLSearchParams({key:getKey(), part:'snippet', q:q, type:'video', maxResults:'50'});
  if(liveOnly) p.set('eventType','live');
  if(largo)    p.set('videoDuration','long');
  if(token)    p.set('pageToken', token);

  fetch('https://www.googleapis.com/youtube/v3/search?' + p.toString())
    .then(function(r){
      return r.json().then(function(d){
        if(!r.ok){
          var e = new Error((d.error && d.error.message) || ('HTTP ' + r.status));
          e.api = d;
          throw e;
        }
        return d;
      });
    })
    .then(function(data){
      bumpQuota();
      /* La API cuela resultados de canal aunque pidamos type=video, y en modo
         vivo devuelve transmisiones ya terminadas. Filtramos los dos casos. */
      var items = (data.items || [])
        .filter(function(it){ return it.id && it.id.videoId; })
        .filter(function(it){
          return !liveOnly || (it.snippet && it.snippet.liveBroadcastContent === 'live');
        });

      if(token){
        results.items = results.items.concat(items);
        results.next  = data.nextPageToken || '';
        render();                       /* el scroll se queda donde estaba */
        return;
      }

      if(!items.length){
        results = null; render();
        $('#panel').innerHTML = '<div class="empty">Sin resultados para <b>' + esc(q) + '</b>.' +
          (liveOnly ? '<br>Puede que no haya nadie transmitiendo ahora.' : '') + '</div>';
        return;
      }

      results = {q:q, items:items, next:data.nextPageToken || '',
                 liveOnly:liveOnly, largo:largo};
      render();
      window.scrollTo(0,0);
    })
    .catch(function(err){
      var m = traducirError(err);
      /* Si fallo al traer mas, no borramos lo que ya estaba en pantalla. */
      if(boton){
        boton.disabled = false;
        boton.textContent = m.t + ' - reintentar';
        return;
      }
      mostrarError(m);
    });
}

/* ============ guardar ============ */
function askSave(idx){
  var it = results.items[idx], s = it.snippet;
  var live = s.liveBroadcastContent === 'live';
  /* Para una radio conviene guardar el CANAL: el ID del video muere cada vez
     que la transmision se reinicia, el canal no. */
  var kind = live ? 'radio' : 'video';

  var NOTA = {
    radio: 'Sigue al canal: abre lo que este al aire, hoy y dentro de un ano.',
    video: 'Guarda esta transmision puntual. Deja de servir cuando termine.'
  };

  function listaCarpetas(){
    return db.folders.map(function(f){
      return '<button class="pick" data-folder="' + esc(f.id) + '">' + esc(f.name) +
             '<small>' + plural(f.items.length, 'elemento', 'elementos') + '</small></button>';
    }).join('') +
    '<button class="pick nueva" data-nueva>+ carpeta nueva</button>';
  }

  function panelNueva(){
    $('#carpetas').innerHTML =
      '<div class="newf">' +
        '<input type="text" id="nf" placeholder="Nombre de la carpeta" maxlength="30" autocomplete="off">' +
        '<button data-crear>Crear</button>' +
      '</div>' +
      '<button class="pick volver" data-volver>&laquo; elegir una existente</button>';
    var nf = $('#nf');
    nf.focus();
    nf.onkeydown = function(ev){ if(ev.key === 'Enter'){ ev.preventDefault(); crearYGuardar(); } };
  }

  function crearYGuardar(){
    var n = $('#nf').value.trim();
    if(!n){ $('#nf').focus(); return; }
    var nueva = {id:'f' + Date.now(), name:n, items:[]};
    db.folders.push(nueva);
    guardarEn(nueva);
  }

  function guardarEn(folder){
    var ytId = kind === 'radio' ? s.channelId : it.id.videoId;
    if(folder.items.some(function(x){ return x.ytId === ytId; })){
      closeModal();
      avisar('Ya estaba guardado', 'Esto ya esta en <b>' + esc(folder.name) + '</b>.');
      return;
    }
    var nuevo = {
      kind: kind,
      ytId: ytId,
      title:   kind === 'radio' ? s.channelTitle : s.title,
      channel: s.channelTitle,
      thumb:   (s.thumbnails && s.thumbnails.medium && s.thumbnails.medium.url) || '',
      addedAt: Date.now()
    };
    folder.items.unshift(nuevo);
    save();
    closeModal();
    /* Nos quedamos en los resultados: guardar dos cosas de la misma busqueda
       no puede costar otra busqueda. La fila ya va a decir donde quedo. */
    render();

    if(kind === 'radio'){
      fetchChannelAvatar(ytId).then(function(url){
        if(!url) return;
        nuevo.thumb = url; save(); render();
      });
    }
  }

  openModal(
    '<h3>Guardar</h3><div class="body">' +
      '<p class="what">' + esc(s.title.slice(0,90)) + '</p>' +
      (live ?
        '<div class="seg" id="seg">' +
          '<button data-kind="radio" class="on">la radio</button>' +
          '<button data-kind="video">este stream</button>' +
        '</div>' +
        '<p class="segnote" id="segnote">' + NOTA.radio + '</p>' : '') +
      '<div class="hint">En que carpeta?</div>' +
      '<div id="carpetas">' + listaCarpetas() + '</div>' +
      '<button class="close" data-cancel>Cancelar</button>' +
    '</div>',
    function(e){
      /* El cambio radio/video actualiza en el lugar. Antes redibujaba el menu
         entero en cada toque, que es parte de por que se sentia trabado. */
      var k = e.target.closest('[data-kind]');
      if(k){
        kind = k.dataset.kind;
        [].forEach.call($('#seg').children, function(b){
          b.classList.toggle('on', b.dataset.kind === kind);
        });
        $('#segnote').textContent = NOTA[kind];
        return;
      }
      if(e.target.closest('[data-cancel]')){ closeModal(); return; }
      if(e.target.closest('[data-nueva]')){ panelNueva(); return; }
      if(e.target.closest('[data-volver]')){ $('#carpetas').innerHTML = listaCarpetas(); return; }
      if(e.target.closest('[data-crear]')){ crearYGuardar(); return; }

      var fb = e.target.closest('[data-folder]');
      if(fb) guardarEn(db.folders.filter(function(x){ return x.id === fb.dataset.folder; })[0]);
    });
}

/* ============ modal ============
   Un unico escuchador para toda la vida de la pagina. Antes se agregaba uno
   nuevo en cada apertura y se acumulaban: al cuarto guardado, un solo toque
   ejecutaba el handler cuatro veces y disparaba alertas de "ya estaba". */
var modalHandler = null;

$('#box').addEventListener('click', function(e){
  if(modalHandler) modalHandler(e);
});

function openModal(html, handler){
  $('#box').innerHTML = html;
  modalHandler = handler || null;
  $('#modal').hidden = false;
}
function closeModal(){
  $('#modal').hidden = true;
  modalHandler = null;
}
$('#modal').addEventListener('click', function(e){ if(e.target.id === 'modal') closeModal(); });

/* Ojo: openModal entrega el EVENTO del click, no el elemento. Esto esperaba un
   elemento y llamaba querySelector sobre el evento, asi que el handler se
   rompia en el primer toque y "Guardar" no guardaba nunca: por eso la clave
   volvia a pedirse en cada visita. */
/* ============ preguntar y avisar ============
   Reemplazan a confirm() y alert(): los del sistema aparecen justo en los
   momentos de decision y ahi es donde mas se nota que no son de la app. */
function confirmar(titulo, cuerpo, etiqueta, alSi){
  openModal(
    '<h3>' + esc(titulo) + '</h3><div class="body">' +
      '<p>' + cuerpo + '</p>' +
      '<button class="close peligro" data-si>' + esc(etiqueta) + '</button>' +
      '<button class="close" data-cancel>Cancelar</button>' +
    '</div>',
    function(e){
      if(e.target.closest('[data-si]')){ closeModal(); alSi(); return; }
      if(e.target.closest('[data-cancel]')) closeModal();
    });
}

function avisar(titulo, cuerpo){
  openModal(
    '<h3>' + esc(titulo) + '</h3><div class="body">' +
      '<p>' + cuerpo + '</p>' +
      '<button class="close" data-cancel>Listo</button>' +
    '</div>',
    function(e){ if(e.target.closest('[data-cancel]')) closeModal(); });
}

function askKey(){
  function decir(t){ $('#keymsg').textContent = t; }

  /* Si el navegador no deja copiar solo, dejamos el enlace escrito y
     seleccionado para copiarlo a mano. */
  function mostrarEnlace(url){
    var i = $('#keyin');
    i.value = url; i.focus(); i.select();
    decir('No pude copiarlo solo: el enlace quedo seleccionado arriba, copialo a mano.');
  }

  openModal(
    '<h3>Clave de API</h3><div class="body">' +
    '<p>Pega tu clave de YouTube Data API v3. Queda guardada en este navegador.</p>' +
    '<input type="text" id="keyin" placeholder="AIza..." autocomplete="off" spellcheck="false" ' +
    'style="width:100%;margin-bottom:10px" value="' + esc(getKey()) + '">' +
    '<p class="segnote" id="keymsg">Para otro dispositivo: guardala aca, copia el enlace y abrilo alla una sola vez. El enlace lleva la clave adentro, no lo publiques.</p>' +
    '<button class="close" id="keysave">Guardar</button>' +
    '<button class="close" id="keycopy">Copiar enlace con la clave</button>' +
    '<button class="close" data-cancel>Cancelar</button></div>',
    function(e){
      if(e.target.closest('#keysave')){
        var v = $('#keyin').value.trim();
        if(!claveValida(v)){ decir('Esa clave no parece valida: todas empiezan con AIza.'); return; }
        setKey(v);
        closeModal();
        if($('#q').value.trim()) doSearch();
        return;
      }
      if(e.target.closest('#keycopy')){
        var k = $('#keyin').value.trim() || getKey();
        if(!claveValida(k)){ decir('Primero pega una clave valida y despues copia el enlace.'); return; }
        setKey(k);                                  /* copiar tambien guarda */
        var url = location.origin + location.pathname + '#k=' + encodeURIComponent(k);
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(url).then(
            function(){ decir('Enlace copiado. Abrilo una vez en el otro dispositivo.'); },
            function(){ mostrarEnlace(url); });
        } else mostrarEnlace(url);
        return;
      }
      if(e.target.closest('[data-cancel]')) closeModal();
    });

  $('#keyin').focus();
}

/* ============ eventos ============ */
$('#go').onclick = doSearch;
$('#q').addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ e.target.blur(); doSearch(); }
});
$('#keylink').onclick = askKey;

/* ============ tema ============
   Sin eleccion guardada seguimos al sistema. Cuando el usuario elige, su
   eleccion manda en los dos sentidos, incluso contra lo que diga el sistema. */
function temaEfectivo(){
  var t = localStorage.getItem('mytbe.tema');
  if(t) return t;
  return (window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}

function aplicarTema(){
  var elegido = localStorage.getItem('mytbe.tema');
  if(elegido) document.documentElement.setAttribute('data-theme', elegido);
  else        document.documentElement.removeAttribute('data-theme');

  var oscuro = temaEfectivo() === 'dark';
  $('#themelink').textContent = oscuro ? 'modo claro' : 'modo oscuro';
  /* Que la barra del navegador y la del sistema acompanen */
  var m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content', oscuro ? '#171b21' : '#dfe6ec');
}

$('#themelink').onclick = function(){
  localStorage.setItem('mytbe.tema', temaEfectivo() === 'dark' ? 'light' : 'dark');
  aplicarTema();
};

/* Si nunca eligio a mano, seguimos al sistema cuando cambia solo */
if(window.matchMedia){
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  var alCambiar = function(){ if(!localStorage.getItem('mytbe.tema')) aplicarTema(); };
  if(mq.addEventListener) mq.addEventListener('change', alCambiar);
  else if(mq.addListener) mq.addListener(alCambiar);
}

$('#tabs').addEventListener('click', function(e){
  var t = e.target.closest('[data-tab]');
  if(t){ current = t.dataset.tab; results = null; modoOrden = false; render(); return; }
  if(e.target.closest('[data-newfolder]')) askNewFolder();
});

/* ============ carpeta nueva ============
   Con prompt() el dialogo del sistema queda feo dentro de la app instalada,
   asi que usamos el mismo cuadro que el resto. */
function askNewFolder(){
  function crear(){
    var n = $('#nf2').value.trim();
    if(!n){ $('#nf2').focus(); return; }
    var f = {id:'f' + Date.now(), name:n, items:[]};
    db.folders.push(f);
    save();
    closeModal();
    current = f.id; results = null; render();
  }

  openModal(
    '<h3>Carpeta nueva</h3><div class="body">' +
      '<p>Como se va a llamar?</p>' +
      '<div class="newf">' +
        '<input type="text" id="nf2" placeholder="Ej: podcasts" maxlength="30" autocomplete="off">' +
        '<button data-crear2>Crear</button>' +
      '</div>' +
      '<button class="close" data-cancel>Cancelar</button>' +
    '</div>',
    function(e){
      if(e.target.closest('[data-cancel]')){ closeModal(); return; }
      if(e.target.closest('[data-crear2]')) crear();
    });

  var i = $('#nf2');
  i.focus();
  i.onkeydown = function(ev){ if(ev.key === 'Enter'){ ev.preventDefault(); crear(); } };
}

/* Ojo con el orden: la fila entera es el area de disparo, asi que las acciones
   que viven dentro de ella se evaluan primero o quedarian tapadas por closest(). */
$('#panel').addEventListener('click', function(e){
  var a;

  if((a = e.target.closest('[data-save]'))){ askSave(+a.dataset.save); return; }
  if((a = e.target.closest('[data-back]'))){ results = null; render(); return; }
  if((a = e.target.closest('[data-rm]'))){
    var fr = db.folders.filter(function(x){ return x.id === current; })[0];
    var item = fr.items.filter(function(i){ return i.ytId === a.dataset.rm; })[0];
    var id = a.dataset.rm;
    confirmar('Eliminar', 'Se saca <b>' + esc(item.title) + '</b> de esta carpeta.', 'Eliminar',
      function(){
        fr.items = fr.items.filter(function(i){ return i.ytId !== id; });
        save(); render();
      });
    return;
  }
  if(e.target.closest('[data-delfolder]')){
    var fd = db.folders.filter(function(x){ return x.id === current; })[0];
    confirmar('Borrar carpeta',
      'Se borra <b>' + esc(fd.name) + '</b>' +
      (fd.items.length ? ' con sus ' + plural(fd.items.length, 'elemento', 'elementos') : '') + '.',
      'Borrar',
      function(){
        db.folders = db.folders.filter(function(x){ return x.id !== fd.id; });
        current = db.folders[0].id; modoOrden = false; save(); render();
      });
    return;
  }

  /* Ordenar y traer mas van antes del disparo: viven dentro de la fila y
     closest() las taparia. */
  if((a = e.target.closest('[data-up]')))   { mover(+a.dataset.up,   -1); return; }
  if((a = e.target.closest('[data-down]'))) { mover(+a.dataset.down,  1); return; }
  if(e.target.closest('[data-orden]'))      { modoOrden = !modoOrden; render(); return; }
  if(e.target.closest('[data-more]'))       { doSearch(results.next); return; }
  if(e.target.closest('[data-abrirclave]')) { askKey(); return; }

  /* Recien ahora: el disparo, que ocupa toda la fila. */
  if((a = e.target.closest('[data-play]'))){
    launch({kind:'video', ytId: results.items[a.dataset.play].id.videoId}); return;
  }
  if((a = e.target.closest('[data-open]'))){
    var fo = db.folders.filter(function(x){ return x.id === current; })[0];
    launch(fo.items.filter(function(i){ return i.ytId === a.dataset.open; })[0]);
  }
});

/* Intercambia con el vecino: alcanza para acomodar una lista a mano y no
   necesita arrastrar, que en tactil pelea con el scroll de la pagina. */
function mover(i, paso){
  var f = db.folders.filter(function(x){ return x.id === current; })[0];
  var j = i + paso;
  if(j < 0 || j >= f.items.length) return;
  var tmp = f.items[i]; f.items[i] = f.items[j]; f.items[j] = tmp;
  save(); render();
}

/* ============ respaldo ============
   Las carpetas viven solo en localStorage: si se limpian los datos del
   navegador, se pierden. Esto es la unica copia posible. */
$('#exp').onclick = function(){
  var total = db.folders.reduce(function(a,f){ return a + f.items.length; }, 0);
  if(!total){
    confirmar('No hay nada guardado', 'El archivo va a salir vacio.', 'Descargar igual', bajar);
    return;
  }
  bajar();
};

function bajar(){
  /* La clave viaja en el respaldo: restaurar en un telefono nuevo deja la app
     lista de una. Es tu clave en tu archivo, pero no lo pases por ahi. */
  var datos = JSON.stringify({
    app:'mytbe', version:1, fecha:new Date().toISOString(),
    clave: getKey(), folders:db.folders
  }, null, 2);

  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([datos], {type:'application/json'}));
  a.download = 'mytbe-respaldo-' + today() + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
}

$('#imp').onclick = function(){ $('#file').click(); };

$('#file').onchange = function(e){
  var f = e.target.files[0];
  e.target.value = '';               /* permite reelegir el mismo archivo */
  if(!f) return;

  var fr = new FileReader();
  fr.onload = function(){
    var d;
    try { d = JSON.parse(fr.result); }
    catch(err){ avisar('Archivo invalido', 'Eso no parece un respaldo de mytbe.'); return; }

    /* Nos quedamos solo con lo que tiene forma de carpeta, por si el archivo
       viene de una version distinta o esta a medio editar. */
    var folders = (d && d.folders || []).filter(function(x){
      return x && x.id && x.name && Object.prototype.toString.call(x.items) === '[object Array]';
    });
    if(!folders.length){ avisar('Archivo invalido', 'El archivo no contiene ninguna carpeta.'); return; }

    var total = folders.reduce(function(a,x){ return a + x.items.length; }, 0);
    var traeClave = claveValida(String(d.clave || '').trim());
    confirmar('Restaurar respaldo',
      'Vuelven <b>' + plural(folders.length, 'carpeta', 'carpetas') + '</b> con ' +
      plural(total, 'elemento', 'elementos') + (traeClave ? ' y la clave de API' : '') +
      '. Reemplaza todo lo que tenes guardado ahora.',
      'Restaurar',
      function(){
        db.folders = folders;
        if(traeClave) setKey(String(d.clave).trim());
        save();
        current = db.folders[0].id;
        results = null;
        modoOrden = false;
        render();
        avisar('Listo', 'Respaldo restaurado.');
      });
  };
  fr.readAsText(f);
};

/* ============ instalable ============
   Sin service worker, Android la agrega como acceso directo con barra de
   navegador en vez de app con icono propio. */
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}

/* ============ conexion ============ */
function estadoRed(){ $('#cinta').hidden = navigator.onLine; }
window.addEventListener('online',  estadoRed);
window.addEventListener('offline', estadoRed);

$('#tabs').addEventListener('scroll', sombrasTabs);
window.addEventListener('resize', sombrasTabs);

aplicarTema();
estadoRed();
renderQuota();
render();
</script>
