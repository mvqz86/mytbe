          (it.dura ? '<b class="dura">' + esc(it.dura) + '</b> &middot; ' : '') +
          'de <b>' + esc(limpiarTexto(s.channelTitle)) + '</b>' +
          (it.vistas ? ' &middot; ' + esc(vistas(it.vistas)) + ' reproducciones' : '') +
          (ya ? ' &middot; <span class="saved">&#10003; en ' + esc(ya) + '</span>' : '') +
        '</div>' +
      '</div>' +
      '<button class="add' + (ya ? ' on' : '') + '" data-save="' + i + '" title="' +
        (ya ? 'Ya esta en ' + esc(ya) + '. Tocalo para guardarlo tambien en otra carpeta'
            : 'Guardar') + '">' + (ya ? '&#10003;' : '+') + '</button>' +
    '</div>';
  }).join('');

  /* La API entrega el token de la pagina siguiente; solo cuando existe hay mas. */
  if(results.next) html += '<div class="more"><button data-more>traer 50 mas</button></div>';

  $('#panel').innerHTML = html;
}

/* ============ errores ============
   La API contesta en ingles y con vocabulario de API. Traducimos por el
   "reason", que es lo unico estable: el texto de Google cambia sin aviso. */
function traducirError(err){
  var api = (err && err.api && err.api.error) || {};
  var razon = (api.errors && api.errors[0] && api.errors[0].reason) || '';
  var texto = api.message || (err && err.message) || '';

  if(razon === 'quotaExceeded' || razon === 'dailyLimitExceeded')
    return {t:'Se acabo la cuota de hoy',
            p:'La clave da unas 100 busquedas por dia y se renueva a las 4 de la manana. Lo que tenes guardado se abre igual.'};

  if(razon === 'keyInvalid' || texto.indexOf('API key not valid') > -1)
    return {t:'La clave no sirve',
            p:'Puede estar mal copiada, o borrada en Google Cloud.', clave:true};

  if(razon === 'ipRefererBlocked')
    return {t:'Google rechazo la clave desde aca',
            p:'La clave tiene una restriccion que no incluye a este sitio.', clave:true};

  if(razon === 'accessNotConfigured')
    return {t:'Falta habilitar la API',
            p:'En Google Cloud hay que activar YouTube Data API v3 para este proyecto.'};

  return {t:'No se pudo buscar', p:'', detalle:texto};
}

function mostrarError(m){
  var html = '<div class="empty"><b class="errt">' + esc(m.t) + '</b>';
  if(m.p)       html += esc(m.p);
  if(m.clave)   html += '<br><button data-abrirclave>Cambiar la clave</button>';
  if(m.detalle) html += '<details class="det"><summary>detalle tecnico</summary>' + esc(m.detalle) + '</details>';
  $('#panel').innerHTML = html + '</div>';
}

/* ============ busqueda ============
   Sin token trae la primera pagina; con token agrega la siguiente abajo,
   sin perder lo que ya estabas mirando. */
function doSearch(token){
  var q = token ? results.q : $('#q').value.trim();
  if(!q) return;
  if(!getKey()){ askKey(); return; }
  if(!navigator.onLine){
    mostrarError({t:'Estas sin conexion',
                  p:'Las carpetas guardadas se abren igual; buscar necesita senal.'});
    return;
  }

  var boton = token ? $('#panel').querySelector('[data-more]') : null;
  if(boton){ boton.disabled = true; boton.textContent = 'buscando...'; }
  else $('#panel').innerHTML = '<div class="loading">Buscando&hellip;</div>';

  var liveOnly = token ? results.liveOnly : $('#f-live').getAttribute('aria-pressed') === 'true';

  /* 50 es el maximo que permite la API y cuesta lo mismo que pedir 25. */
  var p = new URLSearchParams({key:getKey(), part:'snippet', q:q, type:'video', maxResults:'50'});
  if(liveOnly) p.set('eventType','live');
  if(token)    p.set('pageToken', token);

  fetch('https://www.googleapis.com/youtube/v3/search?' + p.toString())
    .then(function(r){
      return r.json().then(function(d){
        if(!r.ok){
          var e = new Error((d.error && d.error.message) || ('HTTP ' + r.status));
          e.api = d;
          throw e;
        }
        return d;
      });
    })
    .then(function(data){
      bumpQuota();
      /* La API cuela resultados de canal aunque pidamos type=video, y en modo
         vivo devuelve transmisiones ya terminadas. Filtramos los dos casos. */
      var items = (data.items || [])
        .filter(function(it){ return it.id && it.id.videoId; })
        .filter(function(it){
          return !liveOnly || (it.snippet && it.snippet.liveBroadcastContent === 'live');
        });

      if(!items.length && !token){
        results = null; render();
        $('#panel').innerHTML = '<div class="empty">Sin resultados para <b>' + esc(q) + '</b>.' +
          (liveOnly ? '<br>Puede que no haya nadie transmitiendo ahora.' : '') + '</div>';
        return;
      }

      /* Con los numeros en la mano se ordena de mas visto a menos. */
      return traerDatos(items).then(function(conVistas){
        if(token){
          results.items = results.items.concat(conVistas).sort(porVistas);
          results.next  = data.nextPageToken || '';
          render();                     /* el scroll se queda donde estaba */
          return;
        }
        results = {q:q, items:conVistas.sort(porVistas), next:data.nextPageToken || '',
                   liveOnly:liveOnly};
        render();
        window.scrollTo(0,0);
      });
    })
    .catch(function(err){
      var m = traducirError(err);
      /* Si fallo al traer mas, no borramos lo que ya estaba en pantalla. */
      if(boton){
        boton.disabled = false;
        boton.textContent = m.t + ' - reintentar';
        return;
      }
      mostrarError(m);
    });
}

/* Que ramas quedaron abiertas en el cuadro de guardar. Fuera de la funcion
   para que sobreviva entre un guardado y el siguiente. */
var abiertosGuardar = {};

/* ============ guardar ============
   El cuadro es el mismo venga de una busqueda o de recientes, asi que recibe
   una forma neutra en vez del snippet crudo de la API. */
function askSave(idx){
  var it = results.items[idx], s = it.snippet;
  askGuardar({
    live:      s.liveBroadcastContent === 'live',
    videoId:   it.id.videoId,
    channelId: s.channelId,
    title:     limpiarTexto(s.title),
    channel:   limpiarTexto(s.channelTitle),
    thumb:     (s.thumbnails && s.thumbnails.medium && s.thumbnails.medium.url) || '',
    dura:      it.dura || ''
  });
}

function deReciente(r){
  return {
    live:      r.kind === 'radio',
    videoId:   r.kind === 'video' ? r.ytId : '',
    channelId: r.kind === 'radio' ? r.ytId : '',
    title:     r.title,
    channel:   r.channel || r.title,
    thumb:     r.thumb,
    dura:      r.dura || ''
  };
}

function askGuardar(base){
  /* Para una radio conviene guardar el CANAL: el ID del video muere cada vez
     que la transmision se reinicia, el canal no. */
  var kind = base.lista ? 'playlist' : (base.live ? 'radio' : 'video');
  /* La eleccion solo tiene sentido si tenemos las dos cosas; desde recientes
     ya viene resuelta. */
  var elegible = base.live && base.videoId && base.channelId;

  var NOTA = {
    radio: 'Sigue al canal: abre lo que este al aire, hoy y dentro de un ano.',
    video: 'Guarda esta transmision puntual. Deja de servir cuando termine.'
  };

  function listaCarpetas(){
    var html = '';
    (function nivel(padre, prof){
      hijasDe(padre).forEach(function(f){
        var hijas = hijasDe(f.id);
        /* Abiertas salvo que las hayan cerrado: al abrir el cuadro se ve la
           forma entera de la coleccion. */
        var abierta = abiertosGuardar[f.id] !== false;
        html +=
          '<div class="rama"' + (prof ? ' style="margin-left:' + (prof * 16) + 'px"' : '') + '>' +
            (hijas.length
              ? '<button class="tri" data-abrir="' + esc(f.id) + '" title="' +
                (abierta ? 'Cerrar' : 'Abrir') + '">' + (abierta ? '&#9660;' : '&#9654;') + '</button>'
              : '<span class="hueco3"></span>') +
            '<button class="pick arbol" data-folder="' + esc(f.id) + '"><span>' + esc(f.name) +
              '</span><small>' + f.items.length + '</small></button>' +
            '<button class="mas" data-dentro="' + esc(f.id) + '" title="' +
              esc(tipoHijaDe(f.id)) + ' nueva adentro de ' + esc(f.name) + '">+</button>' +
          '</div>';
        if(hijas.length && abierta) nivel(f.id, prof + 1);
      });
    })(null, 0);
    return html + '<button class="pick nueva" data-nueva>+ solapa nueva</button>';
  }

  var nuevoPadre = null;

  function panelNueva(padre){
    nuevoPadre = padre || null;
    var madre = padre ? carpetaPorId(padre) : null;
    $('#carpetas').innerHTML =
      '<p class="dentrode">' +
        (madre ? esc(mayus(tipoHijaDe(padre))) + ' nueva adentro de <b>' + esc(madre.name) + '</b>'
               : 'Solapa nueva, de las de arriba') +
      '</p>' +
      '<div class="newf">' +
        '<input type="text" id="nf" placeholder="Nombre" maxlength="30" autocomplete="off">' +
        '<button data-crear>Crear</button>' +
      '</div>' +
      '<button class="pick volver" data-volver>&laquo; elegir una existente</button>';
    var nf = $('#nf');
    nf.focus();
    nf.onkeydown = function(ev){ if(ev.key === 'Enter'){ ev.preventDefault(); crearYGuardar(); } };
  }

  /* Crear desde aca guarda ahi mismo: si la estas creando en este momento,
     es porque lo que tenes en la mano va adentro. */
  function crearYGuardar(){
    var n = $('#nf').value.trim();
    if(!n){ $('#nf').focus(); return; }
    var nueva = {id:'f' + Date.now(), name:n, items:[], padre:nuevoPadre,
                 creadaEn:Date.now(), nombreEn:Date.now()};
    db.folders.push(nueva);
    if(nuevoPadre) abiertosGuardar[nuevoPadre] = true;
    guardarEn(nueva);
  }

  function guardarEn(folder){
    if(kind === 'playlist'){
      var nombre = ($('#plname') && $('#plname').value.trim()) || base.title || 'Lista';
      folder.items.unshift({
        kind:'playlist', ytId:'pl' + Date.now(), title:nombre,
        ytIds: base.ytIds.slice(0, TOPE_LISTA), channel:'', thumb: base.thumb || '',
        dura:'', addedAt: Date.now()
      });
      save();
      closeModal();
      /* Guardarla es el final del armado. */
      if(modoElegir){ modoElegir = false; elegidos = []; }
      render();
      return;
    }
    var ytId = kind === 'radio' ? base.channelId : base.videoId;
    if(folder.items.some(function(x){ return x.ytId === ytId; })){
      closeModal();
      avisar('Ya estaba guardado', 'Esto ya esta en <b>' + esc(folder.name) + '</b>.');
      return;
    }
    var nuevo = {
      kind: kind,
      ytId: ytId,
      title:   kind === 'radio' ? base.channel : base.title,
      channel: base.channel,
      thumb:   base.thumb || '',
      /* Una radio no dura: sigue al aire. */
      dura:    kind === 'radio' ? '' : (base.dura || ''),
      addedAt: Date.now()
    };
    folder.items.unshift(nuevo);
    save();
    closeModal();
    /* Nos quedamos en los resultados: guardar dos cosas de la misma busqueda
       no puede costar otra busqueda. La fila ya va a decir donde quedo. */
    render();

    if(kind === 'radio'){
      fetchChannelAvatar(ytId).then(function(url){
        if(!url) return;
        nuevo.thumb = url; save(); render();
      });
    }
  }

  openModal(
    '<h3>Guardar</h3><div class="body">' +
      (base.lista
        /* A una lista hay que ponerle nombre: no lo trae de ningun lado. */
        ? '<p class="segnote">Lista de <b>' + base.ytIds.length + ' videos</b>, en el orden ' +
          (base.aMano ? 'en que los elegiste' : 'en que se ven') + '. Como se llama?</p>' +
          '<input type="text" id="plname" maxlength="40" autocomplete="off" ' +
          'style="width:100%;margin-bottom:10px" value="' + esc(base.title) + '">'
        : '<p class="what">' + esc(String(base.title).slice(0,90)) + '</p>') +
      (elegible ?
        '<div class="seg" id="seg">' +
          '<button data-kind="radio" class="on">la radio</button>' +
          '<button data-kind="video">este stream</button>' +
        '</div>' +
        '<p class="segnote" id="segnote">' + NOTA.radio + '</p>' : '') +
      '<div class="hint">En que carpeta?</div>' +
      '<div id="carpetas">' + listaCarpetas() + '</div>' +
      '<button class="close" data-cancel>Cancelar</button>' +
    '</div>',
    function(e){
      /* El cambio radio/video actualiza en el lugar. Antes redibujaba el menu
         entero en cada toque, que es parte de por que se sentia trabado. */
      var k = e.target.closest('[data-kind]');
      if(k){
        kind = k.dataset.kind;
        [].forEach.call($('#seg').children, function(b){
          b.classList.toggle('on', b.dataset.kind === kind);
        });
        $('#segnote').textContent = NOTA[kind];
        return;
      }
      if(e.target.closest('[data-cancel]')){ closeModal(); return; }
      if(e.target.closest('[data-nueva]')){ panelNueva(null); return; }
      if(e.target.closest('[data-volver]')){ $('#carpetas').innerHTML = listaCarpetas(); return; }
      if(e.target.closest('[data-crear]')){ crearYGuardar(); return; }

      var ab = e.target.closest('[data-abrir]');
      if(ab){
        abiertosGuardar[ab.dataset.abrir] = abiertosGuardar[ab.dataset.abrir] === false;
        $('#carpetas').innerHTML = listaCarpetas();
        return;
      }
      var dn = e.target.closest('[data-dentro]');
      if(dn){ panelNueva(dn.dataset.dentro); return; }

      var fb = e.target.closest('[data-folder]');
      if(fb) guardarEn(db.folders.filter(function(x){ return x.id === fb.dataset.folder; })[0]);
    });
}

/* ============ modal ============
   Un unico escuchador para toda la vida de la pagina. Antes se agregaba uno
   nuevo en cada apertura y se acumulaban: al cuarto guardado, un solo toque
   ejecutaba el handler cuatro veces y disparaba alertas de "ya estaba". */
var modalHandler = null;

$('#box').addEventListener('click', function(e){
  if(modalHandler) modalHandler(e);
});

function openModal(html, handler){
  $('#box').innerHTML = html;
  modalHandler = handler || null;
  $('#modal').hidden = false;
}
function closeModal(){
  $('#modal').hidden = true;
  modalHandler = null;
}
$('#modal').addEventListener('click', function(e){ if(e.target.id === 'modal') closeModal(); });

/* Ojo: openModal entrega el EVENTO del click, no el elemento. Esto esperaba un
   elemento y llamaba querySelector sobre el evento, asi que el handler se
   rompia en el primer toque y "Guardar" no guardaba nunca: por eso la clave
   volvia a pedirse en cada visita. */
/* ============ preguntar y avisar ============
   Reemplazan a confirm() y alert(): los del sistema aparecen justo en los
   momentos de decision y ahi es donde mas se nota que no son de la app. */
function confirmar(titulo, cuerpo, etiqueta, alSi){
  openModal(
    '<h3>' + esc(titulo) + '</h3><div class="body">' +
      '<p>' + cuerpo + '</p>' +
      '<button class="close peligro" data-si>' + esc(etiqueta) + '</button>' +
      '<button class="close" data-cancel>Cancelar</button>' +
    '</div>',
    function(e){
      if(e.target.closest('[data-si]')){ closeModal(); alSi(); return; }
      if(e.target.closest('[data-cancel]')) closeModal();
    });
}

function avisar(titulo, cuerpo){
  openModal(
    '<h3>' + esc(titulo) + '</h3><div class="body">' +
      '<p>' + cuerpo + '</p>' +
      '<button class="close" data-cancel>Listo</button>' +
    '</div>',
    function(e){ if(e.target.closest('[data-cancel]')) closeModal(); });
}

function askKey(){
  function decir(t){ $('#keymsg').textContent = t; }

  /* Si el navegador no deja copiar solo, dejamos el enlace escrito y
     seleccionado para copiarlo a mano. */
  function mostrarEnlace(url){
    var i = $('#keyin');
    i.value = url; i.focus(); i.select();
    decir('No pude copiarlo solo: el enlace quedo seleccionado arriba, copialo a mano.');
  }

  openModal(
    '<h3>Clave de API</h3><div class="body">' +
    '<p>Pega tu clave de YouTube Data API v3. Queda guardada en este navegador.</p>' +
    '<input type="text" id="keyin" placeholder="AIza..." autocomplete="off" spellcheck="false" ' +
    'style="width:100%;margin-bottom:10px" value="' + esc(getKey()) + '">' +
    '<p class="segnote" id="keymsg">Para otro dispositivo: guardala aca, copia el enlace y abrilo alla una sola vez. El enlace lleva la clave adentro, no lo publiques.</p>' +
    '<button class="close" id="keysave">Guardar</button>' +
    '<button class="close" id="keycopy">Copiar enlace con la clave</button>' +
    '<button class="close" data-cancel>Cancelar</button></div>',
    function(e){
      if(e.target.closest('#keysave')){
        var v = $('#keyin').value.trim();
        if(!claveValida(v)){ decir('Esa clave no parece valida: todas empiezan con AIza.'); return; }
        setKey(v);
        closeModal();
        if($('#q').value.trim()) doSearch();
        return;
      }
      if(e.target.closest('#keycopy')){
        var k = $('#keyin').value.trim() || getKey();
        if(!claveValida(k)){ decir('Primero pega una clave valida y despues copia el enlace.'); return; }
        setKey(k);                                  /* copiar tambien guarda */
        var url = location.origin + location.pathname + '#k=' + encodeURIComponent(k);
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(url).then(
            function(){ decir('Enlace copiado. Abrilo una vez en el otro dispositivo.'); },
            function(){ mostrarEnlace(url); });
        } else mostrarEnlace(url);
        return;
      }
      if(e.target.closest('[data-cancel]')) closeModal();
    });

  $('#keyin').focus();
}

/* ============ eventos ============ */
/* Ojo: doSearch recibe el token de la pagina siguiente. Enganchado derecho al
   boton le llega el evento del click en su lugar, cree que le piden "traer
   mas" de una busqueda que no existe, y no busca nada. */
$('#go').onclick = function(){ doSearch(); };
$('#q').addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ e.target.blur(); doSearch(); }
});
$('#keylink').onclick = askKey;

$('#f-live').onclick = function(){
  this.setAttribute('aria-pressed', this.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
};

/* ============ tema ============
   Sin eleccion guardada seguimos al sistema. Cuando el usuario elige, su
   eleccion manda en los dos sentidos, incluso contra lo que diga el sistema. */
function temaEfectivo(){
  var t = localStorage.getItem('mytbe.tema');
  if(t) return t;
  return (window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}

function aplicarTema(){
  var elegido = localStorage.getItem('mytbe.tema');
  if(elegido) document.documentElement.setAttribute('data-theme', elegido);
  else        document.documentElement.removeAttribute('data-theme');

  var oscuro = temaEfectivo() === 'dark';
  $('#themelink').innerHTML = oscuro ? '&#9728;&#65039;' : '&#127769;';
  $('#themelink').title = oscuro ? 'Modo claro' : 'Modo oscuro';
  /* Que la barra del navegador y la del sistema acompanen */
  var m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content', oscuro ? '#171b21' : '#dfe6ec');
}

$('#themelink').onclick = function(){
  localStorage.setItem('mytbe.tema', temaEfectivo() === 'dark' ? 'light' : 'dark');
  aplicarTema();
};

/* Si nunca eligio a mano, seguimos al sistema cuando cambia solo */
if(window.matchMedia){
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  var alCambiar = function(){ if(!localStorage.getItem('mytbe.tema')) aplicarTema(); };
  if(mq.addEventListener) mq.addEventListener('change', alCambiar);
  else if(mq.addListener) mq.addListener(alCambiar);
}

$('#tabs').addEventListener('click', function(e){
  var t = e.target.closest('[data-tab]');
  if(t){ current = t.dataset.tab; results = null; modoOrden = false; ladoAbierto = false;
         modoCarpetas = false; render(); return; }
  /* Ojo: modoElegir sobrevive al cambio de solapa. Es el punto: juntar cosas
     de carpetas y de solapas distintas en una misma lista. */
  if(e.target.closest('[data-newfolder]')) askNewFolder();
});

/* ============ carpeta nueva ============
   Con prompt() el dialogo del sistema queda feo dentro de la app instalada,
   asi que usamos el mismo cuadro que el resto. */
function askNewFolder(padre){
  function crear(){
    var n = $('#nf2').value.trim();
    if(!n){ $('#nf2').focus(); return; }
    var f = {id:'f' + Date.now(), name:n, items:[], padre:padre || null,
             creadaEn:Date.now(), nombreEn:Date.now()};
    db.folders.push(f);
    save();
    closeModal();
    /* Una subcarpeta se ve como grupo nuevo ahi mismo; una carpeta de arriba
       es una pestana nueva y a esa si conviene ir. */
    if(!padre) current = f.id;
    results = null;
    render();
  }

  var madre = padre ? carpetaPorId(padre) : null;
  var que = tipoHijaDe(padre || null);
  openModal(
    '<h3>' + esc(mayus(que)) + ' nueva</h3><div class="body">' +
      '<p>' + (madre ? 'Adentro de <b>' + esc(madre.name) + '</b>. Como se llama?'
                     : 'Una solapa de las de arriba. Como se va a llamar?') + '</p>' +
      '<div class="newf">' +
        '<input type="text" id="nf2" placeholder="Ej: podcasts" maxlength="30" autocomplete="off">' +
        '<button data-crear2>Crear</button>' +
      '</div>' +
      '<button class="close" data-cancel>Cancelar</button>' +
    '</div>',
    function(e){
      if(e.target.closest('[data-cancel]')){ closeModal(); return; }
      if(e.target.closest('[data-crear2]')) crear();
    });

  var i = $('#nf2');
  i.focus();
  i.onkeydown = function(ev){ if(ev.key === 'Enter'){ ev.preventDefault(); crear(); } };
}

/* Ojo con el orden: la fila entera es el area de disparo, asi que las acciones
   que viven dentro de ella se evaluan primero o quedarian tapadas por closest(). */
$('#panel').addEventListener('click', function(e){
  var a;

  if((a = e.target.closest('[data-save]'))){ askSave(+a.dataset.save); return; }
  if((a = e.target.closest('[data-back]'))){ results = null; render(); return; }
  if((a = e.target.closest('[data-rm]'))){
    /* En la vista lista las filas vienen de varias carpetas, asi que cada una
       dice de cual. */
    var fr = carpetaPorId(a.dataset.en || current);
    var item = fr.items.filter(function(i){ return i.ytId === a.dataset.rm; })[0];
    var id = a.dataset.rm;
    confirmar('Eliminar', 'Se saca <b>' + esc(item.title) + '</b> de esta carpeta.', 'Eliminar',
      function(){
        fr.items = fr.items.filter(function(i){ return i.ytId !== id; });
        db.borrados[fr.id + '|' + id] = Date.now();
        save(); render();
      });
    return;
  }
  if(e.target.closest('[data-delfolder]')){
    var fd = carpetaPorId(current);
    var dentro = descendientes(fd.id);
    confirmar('Borrar ' + tipoDe(fd),
      'Se borra <b>' + esc(fd.name) + '</b>' +
      (dentro.length ? ' con lo que tiene adentro (' + plural(dentro.length, 'carpeta', 'carpetas') + ')' : '') +
      (cuentaDe(fd) ? ' y ' + plural(cuentaDe(fd), 'elemento', 'elementos') : '') + '.',
      'Borrar',
      function(){
        var fuera = {};
        fuera[fd.id] = 1;
        dentro.forEach(function(h){ fuera[h.id] = 1; });
        db.folders = db.folders.filter(function(x){ return !fuera[x.id]; });
        for(var id in fuera) db.borrados[id] = Date.now();
        /* Al volver, la madre si existe; si no, la primera de arriba. */
        current = (fd.padre && carpetaPorId(fd.padre)) ? fd.padre : hijasDe(null)[0].id;
        modoOrden = false; save(); render();
      });
    return;
  }

  /* Ordenar y traer mas van antes del disparo: viven dentro de la fila y
     closest() las taparia. */
  if((a = e.target.closest('[data-todos]'))){
    var suyos = videosDeGrupo(a.dataset.todos);
    var puestos = suyos.every(function(i){ return posicionElegido(i.ytId) > -1; });
    suyos.forEach(function(it){
      var donde = posicionElegido(it.ytId);
      if(puestos){ if(donde > -1) elegidos.splice(donde, 1); }
      else if(donde < 0) elegidos.push({ytId:it.ytId, title:it.title, thumb:it.thumb || ''});
    });
    render();
    return;
  }
  if((a = e.target.closest('[data-play2]'))){
    var cg = carpetaPorId(a.dataset.play2);
    reproducirLista(cg.items.filter(function(i){ return i.kind === 'video'; }), cg.name);
    return;
  }
  if(e.target.closest('[data-playtodo]')){
    var ft = carpetaPorId(current);
    reproducirLista(videosVisibles(ft), ft.name + (filtro.trim() ? ' ' + filtro.trim() : ''));
    return;
  }
  if((a = e.target.closest('[data-elegir]'))){
    var ya = posicionElegido(a.dataset.elegir);
    if(ya > -1) elegidos.splice(ya, 1);
    else {
      /* Puede venir de una carpeta o de recientes, que no es una carpeta. */
      var duena = carpetaPorId(a.dataset.en);
      var lista = duena ? duena.items : db.reproducidos;
      var cual = lista.filter(function(i){ return i.ytId === a.dataset.elegir; })[0];
      if(cual) elegidos.push({ytId:cual.ytId, title:cual.title, thumb:cual.thumb || ''});
    }
    render();
    return;
  }
  if(e.target.closest('[data-acomodar]')){
    modoCarpetas = !modoCarpetas;
    carpetaSel = null;
    render();
    return;
  }
  if((a = e.target.closest('[data-marcarc]'))){
    carpetaSel = (carpetaSel === a.dataset.marcarc ? null : a.dataset.marcarc);
    render();
    return;
  }
  if(e.target.closest('[data-subec]')){ moverCarpeta(carpetaSel, -1); return; }
  if(e.target.closest('[data-bajac]')){ moverCarpeta(carpetaSel,  1); return; }
  if(e.target.closest('[data-moverc]')){ askMoverCarpeta(carpetaSel); return; }
  if((a = e.target.closest('[data-alcance]'))){
    elegida[current] = a.dataset.alcance;
    filtro = '';
    ladoAbierto = false;
    render();
    window.scrollTo(0, 0);
    return;
  }
  if(e.target.closest('[data-verlado]')){ ladoAbierto = !ladoAbierto; render(); return; }
  if((a = e.target.closest('[data-dentro2]'))){ askNewFolder(a.dataset.dentro2); return; }
  if((a = e.target.closest('[data-grupo]'))){
    var fg = carpetaPorId(current);
    if(!fg.plegados) fg.plegados = {};
    fg.plegados[a.dataset.grupo] = !fg.plegados[a.dataset.grupo];
    save();
    renderFolder();
    return;
  }
  if(e.target.closest('[data-nuevasub]')){ askNewFolder(current); return; }
  if((a = e.target.closest('[data-guardar]'))){
    askGuardar(deReciente(db.reproducidos[+a.dataset.guardar])); return;
  }
  if((a = e.target.closest('[data-abrir]')))  { launch(db.reproducidos[+a.dataset.abrir]); return; }
  if(e.target.closest('[data-vaciar]')){
    confirmar('Vaciar recientes', 'Se borra la lista de lo que abriste. Lo guardado en carpetas no se toca.',
      'Vaciar', function(){
        db.reproducidos = [];
        db.vaciadoEn = Date.now();      /* para que no vuelvan al sincronizar */
        save(); render();
      });
    return;
  }
  if((a = e.target.closest('[data-up]')))   { mover(a.dataset.en, +a.dataset.up,   -1); return; }
  if((a = e.target.closest('[data-down]'))) { mover(a.dataset.en, +a.dataset.down,  1); return; }
  if(e.target.closest('[data-orden]')){
    modoOrden = !modoOrden;
    filtro = '';        /* ordenando se trabaja sobre la lista entera */
    render();
    return;
  }
  if(e.target.closest('[data-more]'))       { doSearch(results.next); return; }
  if(e.target.closest('[data-abrirclave]')) { askKey(); return; }

  /* Recien ahora: el disparo, que ocupa toda la fila. */
  if((a = e.target.closest('[data-play]'))){
    var rr = results.items[a.dataset.play], sn = rr.snippet;
    var envivo = sn.liveBroadcastContent === 'live';
    launch({kind:'video', ytId: rr.id.videoId}, {
      kind:    envivo ? 'radio' : 'video',
      ytId:    envivo ? sn.channelId : rr.id.videoId,
      title:   limpiarTexto(envivo ? sn.channelTitle : sn.title),
      channel: limpiarTexto(sn.channelTitle),
      thumb:   (sn.thumbnails && sn.thumbnails.medium && sn.thumbnails.medium.url) || '',
      dura:    envivo ? '' : (rr.dura || '')
    });
    return;
  }
  if((a = e.target.closest('[data-open]'))){
    var fo = carpetaPorId(a.dataset.en || current);
    launch(fo.items.filter(function(i){ return i.ytId === a.dataset.open; })[0]);
  }
});

/* Intercambia con el vecino: alcanza para acomodar una lista a mano y no
   necesita arrastrar, que en tactil pelea con el scroll de la pagina. */
function mover(carpetaId, i, paso){
  var f = carpetaPorId(carpetaId);
  var j = i + paso;
  if(j < 0 || j >= f.items.length) return;
  var tmp = f.items[i]; f.items[i] = f.items[j]; f.items[j] = tmp;
  f.ordenadoEn = Date.now();     /* al fusionar, manda el que ordeno ultimo */
  save(); render();
}

/* ============ respaldo ============
   Las carpetas viven solo en localStorage: si se limpian los datos del
   navegador, se pierden. Esto es la unica copia posible. */
function descargarRespaldo(){
  var total = db.folders.reduce(function(a,f){ return a + f.items.length; }, 0);
  if(!total){
    confirmar('No hay nada guardado', 'El archivo va a salir vacio.', 'Descargar igual', bajar);
    return;
  }
  bajar();
}

function bajar(){
  /* La clave viaja en el respaldo: restaurar en un telefono nuevo deja la app
     lista de una. Es tu clave en tu archivo, pero no lo pases por ahi. */
  var datos = JSON.stringify({
    app:'mytbe', version:1, fecha:new Date().toISOString(),
    clave: getKey(), folders:db.folders
  }, null, 2);

  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([datos], {type:'application/json'}));
  a.download = 'mytbe-respaldo-' + today() + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
}

$('#file').onchange = function(e){
  var f = e.target.files[0];
  e.target.value = '';               /* permite reelegir el mismo archivo */
  if(!f) return;

  var fr = new FileReader();
  fr.onload = function(){
    var d;
    try { d = JSON.parse(fr.result); }
    catch(err){ avisar('Archivo invalido', 'Eso no parece un respaldo de mytbe.'); return; }

    /* Nos quedamos solo con lo que tiene forma de carpeta, por si el archivo
       viene de una version distinta o esta a medio editar. */
    var folders = (d && d.folders || []).filter(function(x){
      return x && x.id && x.name && Object.prototype.toString.call(x.items) === '[object Array]';
    });
    if(!folders.length){ avisar('Archivo invalido', 'El archivo no contiene ninguna carpeta.'); return; }

    var total = folders.reduce(function(a,x){ return a + x.items.length; }, 0);
    var traeClave = claveValida(String(d.clave || '').trim());
    confirmar('Restaurar respaldo',
      'Vuelven <b>' + plural(folders.length, 'carpeta', 'carpetas') + '</b> con ' +
      plural(total, 'elemento', 'elementos') + (traeClave ? ' y la clave de API' : '') +
      '. Reemplaza todo lo que tenes guardado ahora.',
      'Restaurar',
      function(){
        db.folders = folders;
        if(traeClave) setKey(String(d.clave).trim());
        save();
        current = db.folders[0].id;
        results = null;
        modoOrden = false;
        render();
        avisar('Listo', 'Respaldo restaurado.');
      });
  };
  fr.readAsText(f);
};


/* ============ sincronizacion ============
   Tres dispositivos, ningun servidor: el deposito es un gist privado de
   GitHub y el token lo pone el usuario. Se eligio gist porque ya tenes
   cuenta, es privado, guarda historial de versiones y la API acepta CORS.

   La fusion es POR ELEMENTO, no "el ultimo que escribe gana": cada item
   trae su addedAt y cada borrado deja una marca con su hora, asi que
   guardar en el celular y borrar en la tablet conviven sin pisarse. */

var aplicandoRemoto = false, sincronizando = false, tareaSync = null;

/* Adentro del perfil, no en una clave suelta: asi el token queda cifrado
   junto con todo lo demas y el otro usuario no lo encuentra mirando. */
function getGist(){ return db.gist || {}; }
function setGist(g, callado){
  db.gist = g;
  /* Al anotar la hora del ultimo sincronizado no hay que volver a programar
     otro, o queda dando vueltas para siempre. */
  callado ? guardarDatos() : save();
}
function haySync(){ var g = getGist(); return !!(g.token && g.id); }

/* ---- lo que viaja ---- */
function paquete(){
  return {
    app:'mytbe', version:2, actualizado:Date.now(),
    folders: db.folders,
    borrados: db.borrados,
    reproducidos: db.reproducidos,
    vaciadoEn: db.vaciadoEn || 0
  };
}

function marcasUnidas(a, b){
  var r = {};
  [a || {}, b || {}].forEach(function(m){
    for(var k in m) if(!r[k] || m[k] > r[k]) r[k] = m[k];
  });
  return r;
}

/* Dos versiones de la misma carpeta. El orden lo pone el que ordeno mas
   tarde; lo que el otro tenga de mas entra arriba, que es donde entra todo
   lo nuevo en esta app. */
function unirCarpeta(x, y){
  var base = (y.ordenadoEn || 0) > (x.ordenadoEn || 0) ? y : x;
  var otro = base === x ? y : x;

  var porId = {}, extra = [];
  (base.items || []).forEach(function(it){ porId[it.ytId] = it; });
  (otro.items || []).forEach(function(it){
    var ya = porId[it.ytId];
    if(!ya){ porId[it.ytId] = it; extra.push(it); }
    else if((it.addedAt || 0) > (ya.addedAt || 0)) porId[it.ytId] = it;
  });
  extra.sort(function(m, n){ return (n.addedAt || 0) - (m.addedAt || 0); });

  return {
    id: x.id,
    padre:      x.padre || y.padre || null,
    plegados:   x.plegados || y.plegados || {},
    name:       (y.nombreEn || 0) > (x.nombreEn || 0) ? y.name : x.name,
    nombreEn:   Math.max(x.nombreEn || 0, y.nombreEn || 0),
    creadaEn:   Math.max(x.creadaEn || 0, y.creadaEn || 0),
    ordenadoEn: Math.max(x.ordenadoEn || 0, y.ordenadoEn || 0),
    items: extra.concat((base.items || []).map(function(it){ return porId[it.ytId]; }))
  };
}

function unirReproducidos(a, b, vaciadoEn){
  var limite = Math.max(Date.now() - VIDA, vaciadoEn || 0);
  var porId = {};
  (a || []).concat(b || []).forEach(function(r){
    if(!r || !r.ytId || r.cuando <= limite) return;
    if(!porId[r.ytId] || r.cuando > porId[r.ytId].cuando) porId[r.ytId] = r;
  });
  var lista = [];
  for(var k in porId) lista.push(porId[k]);
  lista.sort(function(m, n){ return n.cuando - m.cuando; });
  return lista.slice(0, 60);
}

function fusionar(local, remoto){
  var borrados = marcasUnidas(local.borrados, remoto.borrados);
  var mapa = {}, orden = [];

  function tomar(lista){
    (lista || []).forEach(function(f){
      if(!f || !f.id) return;
      if(!mapa[f.id]){ mapa[f.id] = f; orden.push(f.id); }
      else mapa[f.id] = unirCarpeta(mapa[f.id], f);
    });
  }
  tomar(local.folders);
  tomar(remoto.folders);

  var folders = orden
    /* Una carpeta borrada solo se queda borrada si la marca es posterior a
       cuando se creo: si la volviste a crear despues, gana la carpeta. */
    .filter(function(id){
      var t = borrados[id] || 0;
      return !(t && t > (mapa[id].creadaEn || 0));
    })
    .map(function(id){
      var f = mapa[id];
      f.items = (f.items || []).filter(function(it){
        var t = borrados[id + '|' + it.ytId] || 0;
        return !(t && t > (it.addedAt || 0));
      });
      return f;
    });

  if(!folders.length) folders = defaults().folders;

  return {
    folders: folders,
    borrados: borrados,
    vaciadoEn: Math.max(local.vaciadoEn || 0, remoto.vaciadoEn || 0),
    reproducidos: unirReproducidos(local.reproducidos, remoto.reproducidos,
                                   Math.max(local.vaciadoEn || 0, remoto.vaciadoEn || 0))
  };
}

/* ---- GitHub ---- */
function pedirGist(g){
  return fetch('https://api.github.com/gists/' + encodeURIComponent(g.id), {
    headers: {Authorization:'Bearer ' + g.token, Accept:'application/vnd.github+json'}
  }).then(revisar).then(function(d){
    var f = d.files && d.files['mytbe.json'];
    if(!f) return {};
    /* Un archivo grande llega recortado y hay que ir a buscarlo aparte. */
    if(f.truncated && f.raw_url) return fetch(f.raw_url).then(function(r){ return r.json(); });
    try { return JSON.parse(f.content); } catch(e){ return {}; }
  });
}

function subirGist(g, datos){
  return fetch('https://api.github.com/gists/' + encodeURIComponent(g.id), {
    method:'PATCH',
    headers: {Authorization:'Bearer ' + g.token, Accept:'application/vnd.github+json',
              'Content-Type':'application/json'},
    body: JSON.stringify({files:{'mytbe.json':{content: JSON.stringify(datos, null, 1)}}})
  }).then(revisar);
}

/* Con el mismo token, el segundo dispositivo puede encontrar solo el gist
   que hizo el primero: no hace falta que nadie copie un id a ningun lado. */
function buscarGist(token){
  return fetch('https://api.github.com/gists?per_page=100', {
    headers: {Authorization:'Bearer ' + token, Accept:'application/vnd.github+json'}
  }).then(revisar).then(function(lista){
    for(var i = 0; i < (lista || []).length; i++)
      if(lista[i].files && lista[i].files['mytbe.json']) return lista[i].id;
    return '';
  });
}

function crearGist(token, datos){
  return fetch('https://api.github.com/gists', {
    method:'POST',
    headers: {Authorization:'Bearer ' + token, Accept:'application/vnd.github+json',
              'Content-Type':'application/json'},
    body: JSON.stringify({
      description:'mytbe: carpetas y recientes', public:false,
      files:{'mytbe.json':{content: JSON.stringify(datos, null, 1)}}
    })
  }).then(revisar);
}

/* GitHub explica el motivo en el cuerpo. Tirarlo y quedarse con el numero
   convierte cualquier problema de permisos en una adivinanza. */
function revisar(r){
  if(r.ok) return r.json();
  return r.json().catch(function(){ return {}; }).then(function(d){
    var e = new Error(d.message || ('HTTP ' + r.status));
    e.status = r.status;
    e.github = d.message || '';
    throw e;
  });
}

function errorSync(err){
  if(err.status === 401) return 'ese token no sirve, fijate que este completo y sea clasico';
  if(err.status === 403 || err.status === 404) return 'a ese token le falta el permiso gist';
  if(err.status === 422) return 'GitHub rechazo el contenido';
  return 'no se pudo sincronizar';
}

/* Al conectar conviene ser mas explicito que en el uso diario: es el momento
   en que algo esta mal configurado y hay que decir donde mirar. */
function mensajeConexion(err, teniaId){
  if(err.status === 404 && teniaId) return 'No hay ningun gist con ese id.';
  if(err.status === 404 || err.status === 403)
    return 'GitHub no deja tocar gists con ese token: casi siempre es que no quedo ' +
           'marcado el permiso gist. Entra al token en github.com/settings/tokens, ' +
           'marca la casilla gist y toca Update token.' +
           (err.github ? ' GitHub dice: "' + err.github + '".' : '');
  if(err.status === 401)
    return 'Ese token no sirve. Fijate que este completo y que sea clasico, no fine-grained.';
  return 'No anduvo: ' + errorSync(err) + '.' + (err.github ? ' GitHub dice: "' + err.github + '".' : '');
}

/* ---- el ciclo ---- */
function aplicar(unido){
  aplicandoRemoto = true;
  db.folders      = unido.folders;
  db.borrados     = unido.borrados;
  db.reproducidos = unido.reproducidos;
  db.vaciadoEn    = unido.vaciadoEn;
  if(!db.folders.some(function(f){ return f.id === current; }) && current !== RECIENTES)
    current = db.folders[0].id;
  save();
  aplicandoRemoto = false;
  render();
}

/* Ya no hay renglon en el pie: el estado vive en el menu, y afuera solo se
   asoma como un punto rojo en el engranaje cuando algo anda mal. */
var syncDice = 'apagada', syncMal = false;

function estadoSync(txt, mal){
  syncDice = txt;
  syncMal = !!mal;
  $('#menulink').classList.toggle('alerta', syncMal);
  var e = $('#cfgsync');
  if(e){ e.textContent = txt; e.className = mal ? 'mal' : ''; }
}

function contarSync(){
  var g = getGist();
  if(!g.token || !g.id) return estadoSync('apagada');
  if(!g.ultima) return estadoSync('conectada');
  estadoSync('al dia, ' + hace(g.ultima));
}

function programarSync(){
  if(!haySync()) return;
  clearTimeout(tareaSync);
  /* Un respiro despues del ultimo cambio: guardar tres cosas seguidas sube
     una sola vez. */
  tareaSync = setTimeout(function(){ sincronizar(); }, 4000);
}

function sincronizar(manual){
  var g = getGist();
  if(!g.token || !g.id){ if(manual) avisar('Sin conectar', 'Todavia no configuraste la sincronizacion.'); return; }
  if(!navigator.onLine){ estadoSync('sin conexion', true); return; }
  if(sincronizando) return;

  sincronizando = true;
  estadoSync('sincronizando...');

  pedirGist(g)
    .then(function(remoto){
      var unido = fusionar(paquete(), remoto);
      aplicar(unido);
      var nuevo = paquete();
      /* Si el gist ya dice exactamente esto, no lo escribimos de nuevo. */
      if(JSON.stringify(remoto.folders) === JSON.stringify(nuevo.folders) &&
         JSON.stringify(remoto.reproducidos) === JSON.stringify(nuevo.reproducidos)) return null;
      return subirGist(g, nuevo);
    })
    .then(function(){
      g.ultima = Date.now();
      setGist(g, true);
      sincronizando = false;
      contarSync();
    })
    .catch(function(err){
      sincronizando = false;
      estadoSync(errorSync(err), true);
      if(manual) avisar('No se pudo sincronizar', esc(errorSync(err)) + '.');
    });
}

/* ---- el cuadro ---- */
function askSync(){
  var g = getGist();

  if(g.token && g.id){
    openModal(
      '<h3>Sincronizacion</h3><div class="body">' +
        '<p>Conectada. Las carpetas y los recientes se unen entre tus ' +
        'dispositivos, sin pisarse.</p>' +
        '<p class="segnote">Id del gist, por si lo queres cargar a mano en otro dispositivo:</p>' +
        '<input type="text" id="gistid" readonly value="' + esc(g.id) + '" ' +
        'onclick="this.select()" style="width:100%;margin-bottom:10px">' +
        '<p class="segnote" id="syncmsg">' +
          (g.ultima ? 'Ultima vez: ' + esc(hace(g.ultima)) + '.' : 'Todavia no sincronizo.') + '</p>' +
        '<button class="close" data-ahora>Sincronizar ahora</button>' +
        '<button class="close" data-enlace>Copiar enlace para otro dispositivo</button>' +
        '<button class="close peligro" data-salir>Desconectar</button>' +
        '<button class="close" data-cancel>Cerrar</button>' +
      '</div>',
      function(e){
        if(e.target.closest('[data-ahora]')){
          $('#syncmsg').textContent = 'Sincronizando...';
          sincronizar(true);
          setTimeout(function(){ if($('#syncmsg')) $('#syncmsg').textContent = 'Listo.'; }, 1500);
          return;
        }
        if(e.target.closest('[data-enlace]')){ enlaceCompleto(); return; }
        if(e.target.closest('[data-salir]')){
          closeModal();
          confirmar('Desconectar',
            'Este dispositivo deja de sincronizar. Lo que ya esta guardado no se toca, ' +
            'y el gist queda en tu cuenta de GitHub.', 'Desconectar',
            function(){ db.gist = {}; save(); contarSync(); });
          return;
        }
        if(e.target.closest('[data-cancel]')) closeModal();
      });
    return;
  }

  /* Un solo campo: el id del gist es cosa de la app, no del usuario. Si ya
     hay uno hecho con este token lo encuentra; si no, lo crea. */
  openModal(
    '<h3>Sincronizacion</h3><div class="body">' +
      '<p>Guarda tus carpetas en un <b>gist privado</b> de tu cuenta de GitHub, ' +
      'para tenerlas iguales en la tablet, la compu y el telefono.</p>' +
      '<p class="segnote">Pega un token clasico con el permiso <b>gist</b> y nada mas: ' +
      'github.com/settings/tokens &rarr; Generate new token (classic) &rarr; marcar solo gist.</p>' +
      '<input type="text" id="tokin" placeholder="ghp_..." autocomplete="off" spellcheck="false" ' +
      'style="width:100%;margin-bottom:10px">' +
      '<p class="segnote" id="syncmsg">Eso es todo: del gist me encargo yo. ' +
      'En los otros dispositivos, el mismo token alcanza.</p>' +
      '<button class="close" data-conectar>Conectar</button>' +
      '<button class="close" data-cancel>Cancelar</button>' +
      '<p class="segnote" style="text-align:center;margin:12px 0 0">' +
        '<a data-manual>cargar el id de un gist a mano</a></p>' +
    '</div>',
    function(e){
      if(e.target.closest('[data-cancel]')){ closeModal(); return; }

      if(e.target.closest('[data-manual]')){
        if(!$('#gistin')){
          var campo = document.createElement('input');
          campo.type = 'text'; campo.id = 'gistin';
          campo.placeholder = 'id del gist';
          campo.autocomplete = 'off'; campo.spellcheck = false;
          campo.style.cssText = 'width:100%;margin:0 0 10px';
          $('#syncmsg').parentNode.insertBefore(campo, $('#syncmsg'));
        }
        $('#gistin').focus();
        return;
      }

      if(!e.target.closest('[data-conectar]')) return;

      /* Un token de GitHub es solo letras, numeros y guion bajo: sacamos
         comillas y espacios que se cuelan al copiar. */
      var token = $('#tokin').value.replace(/[^A-Za-z0-9_-]/g, '');
      var id    = $('#gistin') ? $('#gistin').value.trim() : '';
      if(token.length < 20){ $('#syncmsg').textContent = 'Ese token parece incompleto.'; return; }

      var decir = function(t){ if($('#syncmsg')) $('#syncmsg').textContent = t; };
      decir(id ? 'Conectando...' : 'Buscando si ya tenes uno...');

      (id ? Promise.resolve(id) : buscarGist(token))
        .then(function(gid){
          if(!gid){
            decir('Creando el gist...');
            return crearGist(token, paquete()).then(function(d){ return d.id; });
          }
          decir('Uniendo con lo que ya habia...');
          var g2 = {token:token, id:gid};
          return pedirGist(g2)
            .then(function(remoto){
              aplicar(fusionar(paquete(), remoto));
              return subirGist(g2, paquete());
            })
            .then(function(){ return gid; });
        })
        .then(function(gid){
          setGist({token:token, id:gid, ultima:Date.now()});
          closeModal();
          contarSync();
          avisar('Listo', 'Sincronizacion conectada. En los otros dispositivos pega el ' +
                          'mismo token en este mismo cuadro, o usa el enlace que copia.');
        })
        .catch(function(err){ decir(mensajeConexion(err, !!id)); });
    });

  $('#tokin').focus();
}

/* Un enlace con la clave de API y el token adentro. Es comodo y es delicado:
   quien lo tenga entra a los gists de esa cuenta. */
function enlaceCompleto(){
  var g = getGist();
  var url = location.origin + location.pathname +
            '#k=' + encodeURIComponent(getKey()) +
            '&g=' + encodeURIComponent(g.token + ':' + g.id);
  var decir = function(t){ if($('#syncmsg')) $('#syncmsg').textContent = t; };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(
      function(){ decir('Enlace copiado. Abrilo una vez en el otro dispositivo y borralo de donde lo hayas pegado.'); },
      function(){ decir('No pude copiarlo solo.'); });
  } else decir('Este navegador no deja copiar solo.');
}


/* ============ perfiles ============
   Dos personas, un aparato. No hay servidor que valide nada, asi que esto no
   es un login: es cifrado de verdad. Cada perfil guarda su JSON cifrado con
   AES-GCM y una llave derivada de su contrasena con PBKDF2. Sin la
   contrasena, en el navegador solo se ve ruido; ni siquiera se puede
   verificar si acerto, porque el propio descifrado es el que falla.

   Un perfil tambien puede no tener contrasena: entonces se guarda en claro y
   entra directo. Es lo que pasa con el perfil que ya existia, para que la
   actualizacion no le pida nada a nadie. */

var PERF = 'mytbe.perfiles', ACTUAL = 'mytbe.actual', DATOS = 'mytbe.datos.';
var perfiles = [], perfilActual = null, llaveActual = null, gistPendiente = null;

function leerPerfiles(){
  try { return JSON.parse(localStorage.getItem(PERF)) || []; }
  catch(e){ return []; }
}
function guardarPerfiles(){ localStorage.setItem(PERF, JSON.stringify(perfiles)); }
function perfilPorId(id){
  for(var i = 0; i < perfiles.length; i++) if(perfiles[i].id === id) return perfiles[i];
  return null;
}

/* ---- cifrado ---- */
function aTexto(buf){
  var b = new Uint8Array(buf), s = '';
  for(var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
  return btoa(s);
}
function aBytes(t){
  var s = atob(t), b = new Uint8Array(s.length);
  for(var i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
  return b;
}
function salNueva(){ return aTexto(crypto.getRandomValues(new Uint8Array(16))); }

function derivar(clave, sal){
  return crypto.subtle
    .importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveKey'])
    .then(function(base){
      return crypto.subtle.deriveKey(
        {name:'PBKDF2', salt:aBytes(sal), iterations:150000, hash:'SHA-256'},
        base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
    });
}

function cifrar(llave, texto){
  var iv = crypto.getRandomValues(new Uint8Array(12));
  return crypto.subtle.encrypt({name:'AES-GCM', iv:iv}, llave,
                               new TextEncoder().encode(texto))
    .then(function(ct){
      var todo = new Uint8Array(iv.length + ct.byteLength);
      todo.set(iv, 0);
      todo.set(new Uint8Array(ct), iv.length);
      return aTexto(todo);
    });
}

function descifrar(llave, blob){
  var todo = aBytes(blob);
  return crypto.subtle.decrypt({name:'AES-GCM', iv:todo.slice(0, 12)}, llave, todo.slice(12))
    .then(function(pt){ return new TextDecoder().decode(pt); });
}

/* ---- guardar y cargar ---- */
/* En cola: cifrar tarda, y dos guardados encimados podrian escribirse al
   reves y dejar el ultimo cambio afuera. */
var cola = Promise.resolve();

function guardarDatos(){
  if(!perfilActual) return cola;
  var texto = JSON.stringify(db), perfil = perfilActual, llave = llaveActual;
  cola = cola.then(function(){
    if(!perfil.sal){ localStorage.setItem(DATOS + perfil.id, texto); return; }
    return cifrar(llave, texto).then(function(blob){
      localStorage.setItem(DATOS + perfil.id, blob);
    });
  }).catch(function(){});
  return cola;
}

function cargarDatos(perfil, llave){
  var crudo = localStorage.getItem(DATOS + perfil.id);
  if(!crudo) return Promise.resolve(defaults());
  if(!perfil.sal){
    try { return Promise.resolve(JSON.parse(crudo)); }
    catch(e){ return Promise.resolve(defaults()); }
  }
  return descifrar(llave, crudo).then(function(t){ return JSON.parse(t); });
}

/* ---- arranque ---- */
function arrancar(){
  perfiles = leerPerfiles();
  if(!perfiles.length) migrarAPerfiles();

  var p = perfilPorId(localStorage.getItem(ACTUAL)) || perfiles[0];

  /* Con un solo perfil sin contrasena no hay a quien preguntarle nada: la app
     abre igual que siempre. El candado aparece recien cuando hace falta. */
  if(perfiles.length === 1 && !p.sal){ entrar(p, null); return; }
  pedirPerfil();
}

/* Lo que ya estaba guardado pasa a ser el primer perfil, sin contrasena y sin
   molestar a nadie. */
function migrarAPerfiles(){
  var p = {id:'p1', nombre:'Yo', sal:null};
  var viejo = localStorage.getItem(LS);
  var g = null;
  try { g = JSON.parse(localStorage.getItem('mytbe.gist')); } catch(e){}

  var d = defaults();
  if(viejo){ try { d = JSON.parse(viejo); } catch(e){} }
  if(g && g.token) d.gist = g;

  localStorage.setItem(DATOS + p.id, JSON.stringify(d));
  localStorage.removeItem(LS);
  localStorage.removeItem('mytbe.gist');
  perfiles = [p];
  guardarPerfiles();
  localStorage.setItem(ACTUAL, p.id);
}

function entrar(perfil, llave){
  return cargarDatos(perfil, llave).then(function(d){
    perfilActual = perfil;
    llaveActual = llave;
    db = normalizar(d);
    if(gistPendiente){ db.gist = gistPendiente; gistPendiente = null; guardarDatos(); }
    current = db.folders[0].id;
    results = null;
    modoOrden = false;
    localStorage.setItem(ACTUAL, perfil.id);
    $('#candado').hidden = true;
    $('#perfillink').title = 'Perfil: ' + perfil.nombre;
    contarSync();
    renderQuota();
    render();
    if(haySync()) setTimeout(function(){ sincronizar(); }, 800);
  });
}

/* Cerrar deja la llave afuera: no queda guardada en ningun lado, asi que
   volver a entrar pide la contrasena de nuevo. */
function salir(){
  llaveActual = null;
  perfilActual = null;
  db = defaults();
  clearTimeout(tareaSync);
  pedirPerfil();
}

/* ---- la pantalla del candado ---- */
function pedirPerfil(){
  $('#candado').hidden = false;
  $('#cbox').innerHTML =
    '<div class="box"><h3>Quien sos</h3><div class="body">' +
      perfiles.map(function(p){
        return '<button class="pick" data-perfil="' + esc(p.id) + '">' + esc(p.nombre) +
               '<small>' + (p.sal ? 'con contrasena' : 'sin contrasena') + '</small></button>';
      }).join('') +
    '</div></div>';
}

var perfilPidiendo = null;

function pedirClave(perfil){
  perfilPidiendo = perfil;
  $('#cbox').innerHTML =
    '<div class="box"><h3>' + esc(perfil.nombre) + '</h3><div class="body">' +
      '<p>Tu contrasena para abrir este perfil.</p>' +
      '<input type="password" id="clavein" autocomplete="off" style="width:100%;margin-bottom:10px">' +
      '<p class="segnote" id="cmsg">Si no es la correcta, no hay forma de leer estos datos.</p>' +
      '<button class="close" data-entrar>Entrar</button>' +
      '<button class="close" data-volver>Volver</button>' +
    '</div></div>';
  $('#clavein').focus();
  $('#clavein').onkeydown = function(e){ if(e.key === 'Enter') abrirCon(perfil); };
}

function abrirCon(perfil){
  var clave = $('#clavein').value;
  if(!clave){ $('#clavein').focus(); return; }
  $('#cmsg').textContent = 'Abriendo...';
  derivar(clave, perfil.sal)
    .then(function(llave){ return entrar(perfil, llave); })
    .catch(function(){
      $('#cmsg').textContent = 'Esa contrasena no es.';
      $('#clavein').value = '';
      $('#clavein').focus();
    });
}

$('#candado').addEventListener('click', function(e){
  var a;
  if((a = e.target.closest('[data-perfil]'))){
    var p = perfilPorId(a.dataset.perfil);
    p.sal ? pedirClave(p) : entrar(p, null);
    return;
  }
  if(e.target.closest('[data-entrar]')){ abrirCon(perfilPidiendo); return; }
  if(e.target.closest('[data-volver]')) pedirPerfil();
});

/* ---- administrar ---- */
function askPerfil(){
  var p = perfilActual;
  openModal(
    '<h3>Perfil</h3><div class="body">' +
      '<p>Estas en <b>' + esc(p.nombre) + '</b>' +
      (p.sal ? ', con contrasena.' : ', sin contrasena: cualquiera que agarre el aparato lo abre.') + '</p>' +
      (perfiles.length < 2
        ? '<button class="close" data-nuevo>Agregar el segundo perfil</button>'
        : '<button class="close" data-cambiar>Cambiar de perfil</button>') +
      '<button class="close" data-clave>' + (p.sal ? 'Cambiar la contrasena' : 'Poner una contrasena') + '</button>' +
      (p.sal ? '<button class="close" data-sinclave>Sacar la contrasena</button>' : '') +
      (perfiles.length > 1 ? '<button class="close peligro" data-borrar>Borrar este perfil</button>' : '') +
      '<button class="close" data-cancel>Cerrar</button>' +
    '</div>',
    function(e){
      if(e.target.closest('[data-cancel]')){ closeModal(); return; }
      if(e.target.closest('[data-cambiar]')){ closeModal(); salir(); return; }
      if(e.target.closest('[data-nuevo]')){ closeModal(); askNuevoPerfil(); return; }
      if(e.target.closest('[data-clave]')){ closeModal(); askClavePerfil(); return; }

      if(e.target.closest('[data-sinclave]')){
        closeModal();
        confirmar('Sacar la contrasena',
          'Los datos de <b>' + esc(p.nombre) + '</b> pasan a guardarse sin cifrar, y el perfil ' +
          'se abre sin preguntar nada.', 'Sacar',
          function(){
            localStorage.removeItem(DATOS + p.id);
            p.sal = null; llaveActual = null;
            guardarPerfiles(); guardarDatos();
            avisar('Listo', 'Ese perfil ya no pide contrasena.');
          });
        return;
      }

      if(e.target.closest('[data-borrar]')){
        closeModal();
        confirmar('Borrar perfil',
          'Se borra <b>' + esc(p.nombre) + '</b> con todas sus carpetas de este aparato. ' +
          'No se puede deshacer.', 'Borrar',
          function(){
            localStorage.removeItem(DATOS + p.id);
            perfiles = perfiles.filter(function(x){ return x.id !== p.id; });
            guardarPerfiles();
            salir();
          });
      }
    });
}

function askNuevoPerfil(){
  openModal(
    '<h3>Segundo perfil</h3><div class="body">' +
      '<p>Sus carpetas y sus recientes, aparte de los tuyos. Vive solo en este aparato.</p>' +
      '<input type="text" id="np" placeholder="Nombre" maxlength="20" autocomplete="off" ' +
      'style="width:100%;margin-bottom:8px">' +
      '<input type="password" id="nc" placeholder="Contrasena (puede ser un numero)" ' +
      'autocomplete="new-password" style="width:100%;margin-bottom:10px">' +
      '<p class="segnote" id="npmsg">Sin contrasena, sus carpetas quedan a la vista de cualquiera. ' +
      'Con contrasena no hay forma de recuperarlas si se olvida.</p>' +
      '<button class="close" data-crear>Crear</button>' +
      '<button class="close" data-cancel>Cancelar</button>' +
    '</div>',
    function(e){
      if(e.target.closest('[data-cancel]')){ closeModal(); return; }
      if(!e.target.closest('[data-crear]')) return;

      var nombre = $('#np').value.trim(), clave = $('#nc').value;
      if(!nombre){ $('#npmsg').textContent = 'Falta el nombre.'; $('#np').focus(); return; }

      var nuevo = {id:'p' + Date.now(), nombre:nombre, sal:clave ? salNueva() : null};
      var datos = JSON.stringify(defaults());

      var listo = function(){
        perfiles.push(nuevo);
        guardarPerfiles();
        closeModal();
        avisar('Listo', 'Ya existe <b>' + esc(nombre) + '</b>. Para entrar, tocá el ' +
                        'muñequito de arriba y despues <b>cambiar de perfil</b>.');
      };

      if(!clave){ localStorage.setItem(DATOS + nuevo.id, datos); listo(); return; }
      $('#npmsg').textContent = 'Creando...';
      derivar(clave, nuevo.sal)
        .then(function(k){ return cifrar(k, datos); })
        .then(function(blob){ localStorage.setItem(DATOS + nuevo.id, blob); listo(); })
        .catch(function(){ $('#npmsg').textContent = 'No se pudo crear.'; });
    });

  $('#np').focus();
}

function askClavePerfil(){
  var p = perfilActual;
  openModal(
    '<h3>Contrasena</h3><div class="body">' +
      '<p>De aca en mas, <b>' + esc(p.nombre) + '</b> se guarda cifrado y pide esto para abrir.</p>' +
      '<input type="password" id="c1" placeholder="Contrasena nueva" autocomplete="new-password" ' +
      'style="width:100%;margin-bottom:8px">' +
      '<input type="password" id="c2" placeholder="Otra vez" autocomplete="new-password" ' +
      'style="width:100%;margin-bottom:10px">' +
      '<p class="segnote" id="cpmsg">Si se olvida, esos datos no los recupera nadie. ' +
      'Ni yo, ni vos, ni GitHub.</p>' +
      '<button class="close" data-poner>Guardar</button>' +
      '<button class="close" data-cancel>Cancelar</button>' +
    '</div>',
    function(e){
      if(e.target.closest('[data-cancel]')){ closeModal(); return; }
      if(!e.target.closest('[data-poner]')) return;

      var a = $('#c1').value, b = $('#c2').value;
      if(!a){ $('#cpmsg').textContent = 'Escribi una contrasena.'; return; }
      if(a !== b){ $('#cpmsg').textContent = 'Las dos no coinciden.'; $('#c2').value = ''; $('#c2').focus(); return; }

      $('#cpmsg').textContent = 'Cifrando...';
      var sal = salNueva();
      derivar(a, sal).then(function(k){
        p.sal = sal;
        llaveActual = k;
        guardarPerfiles();
        return guardarDatos();
      }).then(function(){
        closeModal();
        avisar('Listo', 'Desde ahora ese perfil pide contrasena.');
      }).catch(function(){ $('#cpmsg').textContent = 'No se pudo guardar.'; });
    });

  $('#c1').focus();
}

/* ============ configuracion ============
   Todo lo que antes eran links de texto al pie. Se guarda detras del
   engranaje: son cosas que se tocan una vez cada tanto y no tienen por que
   estar a la vista todo el tiempo. */
function askConfig(){
  openModal(
    '<h3>Configuracion</h3><div class="body">' +
      '<div class="hint">Respaldo</div>' +
      '<p class="segnote">Las carpetas viven en este navegador. Esta es la copia.</p>' +
      '<button class="close" data-bajar>Descargar copia</button>' +
      '<button class="close" data-subir>Restaurar copia</button>' +

      '<div class="hint">Al disparar</div>' +
      '<p class="segnote">A que app se le entrega lo que tocas. YouTube Music aparece ' +
      'en Android Auto con el tema en pantalla; YouTube no. Ojo: no todo video existe ' +
      'en Music, y las radios y las listas van a YouTube igual.</p>' +
      '<div class="seg" id="segdest">' +
        '<button data-dest="" class="' + (aMusic() ? '' : 'on') + '">YouTube</button>' +
        '<button data-dest="music" class="' + (aMusic() ? 'on' : '') + '">YouTube Music</button>' +
      '</div>' +

      '<div class="hint">Sincronizacion</div>' +
      '<p class="segnote">Estado: <span id="cfgsync"' + (syncMal ? ' class="mal"' : '') + '>' +
        esc(syncDice) + '</span></p>' +
      '<button class="close" data-sync>' + (haySync() ? 'Ver la sincronizacion' : 'Conectar la sincronizacion') + '</button>' +

      '<button class="close" data-cancel>Cerrar</button>' +
    '</div>',
    function(e){
      var d = e.target.closest('[data-dest]');
      if(d){
        localStorage.setItem('mytbe.destino', d.dataset.dest);
        [].forEach.call($('#segdest').children, function(b){
          b.classList.toggle('on', b.dataset.dest === d.dataset.dest);
        });
        return;
      }
      if(e.target.closest('[data-bajar]')){ closeModal(); descargarRespaldo(); return; }
      if(e.target.closest('[data-subir]')){ closeModal(); $('#file').click(); return; }
      if(e.target.closest('[data-sync]')){ closeModal(); askSync(); return; }
      if(e.target.closest('[data-cancel]')) closeModal();
    });
}

/* ============ instalable ============
   Sin service worker, Android la agrega como acceso directo con barra de
   navegador en vez de app con icono propio. */
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}

/* ============ conexion ============ */
function barraLista(){
  var b = $('#barralista');
  b.hidden = !modoElegir;
  $('#f-lista').setAttribute('aria-pressed', modoElegir ? 'true' : 'false');
  if(!modoElegir) return;
  b.innerHTML = '<button data-todolovisto>+ todo lo que se ve</button>' +
    (elegidos.length
      ? '<b>' + plural(elegidos.length, 'elegido', 'elegidos') + '</b>' +
        '<span class="der">' +
          '<button data-playelegidos>&#9654; reproducir</button>' +
          '<button data-listaelegidos>guardar</button>' +
        '</span>'
      : '<span style="margin-left:4px">o toca uno por uno</span>');
}

$('#barralista').addEventListener('click', function(e){
  if(e.target.closest('[data-todolovisto]')){
    var fv = carpetaPorId(current);
    var raizv = carpetaPorId(elegida[fv.id]) || fv;
    var vs = videosVisibles(raizv);
    var puestos = vs.length && vs.every(function(i){ return posicionElegido(i.ytId) > -1; });
    vs.forEach(function(it){
      var donde = posicionElegido(it.ytId);
      if(puestos){ if(donde > -1) elegidos.splice(donde, 1); }
      else if(donde < 0) elegidos.push({ytId:it.ytId, title:it.title, thumb:it.thumb || ''});
    });
    render();
    return;
  }
  if(e.target.closest('[data-playelegidos]')){
    reproducirLista(elegidos, 'Playlist');
    salirDeLista();
    return;
  }
  if(e.target.closest('[data-listaelegidos]')){
    askGuardar({
      lista: true,
      ytIds: elegidos.map(function(i){ return i.ytId; }),
      aMano: true,
      title: 'Playlist',
      channel: '',
      thumb: elegidos[0] ? elegidos[0].thumb : ''
    });
  }
});

$('#f-lista').onclick = function(){
  modoElegir = !modoElegir;
  if(!modoElegir) elegidos = [];
  modoOrden = false;
  render();
};

function estadoRed(){ $('#cinta').hidden = navigator.onLine; }
window.addEventListener('online',  estadoRed);
window.addEventListener('offline', estadoRed);

/* Arrastrar una carpeta encima de otra la mete adentro. Anda con mouse; en
   tactil el navegador no dispara estos eventos, y para eso estan las flechas
   y el boton de mover, que funcionan en los dos lados. */
$('#panel').addEventListener('dragstart', function(e){
  var c = e.target.closest('[data-arrastra]');
  if(!c) return;
  arrastrando = c.dataset.arrastra;
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', arrastrando); } catch(x){}
});

$('#panel').addEventListener('dragover', function(e){
  var c = e.target.closest('[data-arrastra]');
  if(!c || !arrastrando || !puedeIrA(arrastrando, c.dataset.arrastra)) return;
  e.preventDefault();
  c.classList.add('encima');
});

$('#panel').addEventListener('dragleave', function(e){
  var c = e.target.closest('[data-arrastra]');
  if(c) c.classList.remove('encima');
});

$('#panel').addEventListener('drop', function(e){
  var c = e.target.closest('[data-arrastra]');
  if(!c || !arrastrando) return;
  e.preventDefault();
  c.classList.remove('encima');
  meterEn(arrastrando, c.dataset.arrastra);
  arrastrando = null;
});

/* El filtro no pasa por render(): redibuja solo el panel y devuelve el foco. */
$('#panel').addEventListener('input', function(e){
  if(e.target.id !== 'filtro') return;
  filtro = e.target.value;
  refiltrar();
});

$('#tabs').addEventListener('scroll', sombrasTabs);
window.addEventListener('resize', sombrasTabs);

$('#perfillink').onclick = askPerfil;
$('#menulink').onclick = askConfig;

aplicarTema();
estadoRed();

/* Lo ultimo: pintar depende de que haya un perfil abierto, y abrirlo puede
   necesitar una contrasena. Lo que sigue lo hace entrar(). */
arrancar();
</script>
